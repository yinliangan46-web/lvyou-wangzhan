<style>
  :root{--primary:#2563eb;--bg:#f4f7fc;--card:#fff;--text:#1a2433;--muted:#6b7787;--line:#e6ecf5;--soft:#eef3ff;--radius:16px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .container{max-width:1120px;margin:0 auto;padding:0 18px}
  header{background:#fff;box-shadow:0 2px 12px rgba(20,50,100,.08);position:sticky;top:0;z-index:20}
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--primary);text-decoration:none}
  .nav-links{display:flex;gap:18px;flex-wrap:wrap}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:14px}
  .nav-links a:hover{color:var(--primary)}
  .hero{padding:30px 0 16px}
  .hero h1{font-size:25px;font-weight:900;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:15px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--primary);text-decoration:none;font-size:14px;margin:14px 0}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:20px 0}
  .theme-card{background:var(--card);border-radius:var(--radius);padding:20px;cursor:pointer;border:1.5px solid transparent;transition:.18s;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .theme-card:hover{transform:translateY(-3px)}
  .theme-icon{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
  .theme-card h3{font-size:16px;margin-bottom:4px}
  .theme-card .desc{color:var(--muted);font-size:13px}
  .theme-meta{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .route-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:20px 0}
  .route-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(20,50,100,.06);display:flex;flex-direction:column;cursor:pointer}
  .route-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .city-tag{background:var(--soft);color:var(--primary);border-radius:8px;padding:3px 10px;font-size:12px}
  .price{font-weight:900;color:var(--primary)}
  .route-card h4{font-size:15px;margin-bottom:6px}
  .route-card .hl{color:var(--muted);font-size:13px;margin-bottom:10px}
  .route-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .rtag{background:#f2f5fa;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .route-link{margin-top:12px;color:var(--primary);text-decoration:none;font-size:13px;font-weight:700}
  .detail{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 24px rgba(20,50,100,.08);margin:16px 0 30px}
  .detail-cover{padding:24px;color:#fff;background:linear-gradient(135deg,#2563eb,#4f86f7)}
  .detail-cover h2{font-size:22px;font-weight:900}
  .detail-cover .sub{opacity:.9;margin-top:4px;font-size:14px}
  .section{padding:18px 22px;border-top:1px solid var(--line)}
  .section h3{font-size:15px;color:var(--primary);margin-bottom:12px}
  .node{padding:10px 0;border-bottom:1px dashed var(--line)}
  .node:last-child{border-bottom:none}
  .node .t{font-weight:700;font-size:14px}
  .node .d{color:var(--muted);font-size:13px;margin-top:2px}
  .tag{background:var(--soft);color:var(--primary);border-radius:8px;padding:2px 9px;font-size:12px;margin-left:6px}
  .link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .link-card{border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px}
  .link-card b{font-size:14px}
  .link-card span{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px}
</style>

function $(id){return document.getElementById(id);}

function findCity(name){
  if(!window.MYL) return null;
  var hit=MYL.getCity(name);
  if(hit) return hit;
  var main=name.split(/[·—-]/)[0].trim();
  return MYL.getCity(main);
}

function routeData(route){
  var c=findCity(route.city);
  var isA=c&&c.tier==='A';
  var nodes=[], foods=[], traffic=[];
  if(isA){
    nodes=(c.itinerary||[]).reduce(function(a,day){
      (day.timeline||[]).forEach(function(t){a.push({n:t.activity||'',d:t.detail||'',t:[t.ticket,t.duration].filter(Boolean).join(' · ')});});
      return a;
    },[]);
    foods=(c.foods||[]).map(function(f){return {n:f.name,d:f.desc||'',p:f.price||''};});
    traffic=(c.transport||[]).map(function(t){return t.label+'：'+t.value;});
  } else if(c){
    nodes=(c.bLandmarks||[]).map(function(x){return {n:x,d:'当地代表性地标',t:''};});
    foods=(c.bFoods||[]).map(function(f){return {n:f,d:'',p:''};});
  }
  var flight=(c&&c.airfare&&c.airfare[0])?c.airfare[0].bookingUrl:'https://flights.ctrip.com';
  var train=(c&&c.trains&&c.trains[0])?c.trains[0].bookingUrl:'https://www.12306.cn';
  var hotelsUrl=(c&&c.hotels&&c.hotels[0]&&c.hotels[0].bookingUrl)||'https://hotels.ctrip.com';
  return {c:c,isA:isA,nodes:nodes,foods:foods,traffic:traffic,flight:flight,train:train,hotelsUrl:hotelsUrl};
}

function viewThemes(){
  $('view').innerHTML='<section class="theme-grid">'+THEMES.map(function(t){
    return '<div class="theme-card" data-id="'+t.id+'">'+
      '<div class="theme-icon"><i class="fas '+t.icon+'"></i></div>'+
      '<h3>'+t.name+'</h3><div class="desc">'+t.desc+'</div>'+
      '<div class="theme-meta"><span><i class="fas fa-users"></i> '+t.who+'</span><span><i class="fas fa-wallet"></i> '+t.budget+'</span><span><i class="far fa-clock"></i> '+t.days+'</span></div>'+
    '</div>';
  }).join('')+'</section>';
  Array.prototype.forEach.call(document.querySelectorAll('.theme-card'),function(el){
    el.onclick=function(){location.hash='#/theme/'+el.dataset.id;};
  });
}

function viewTheme(id){

    '<section class="route-grid">'+t.routes.map(function(r,i){
      return '<div class="route-card" data-t="'+t.id+'" data-i="'+i+'">'+
        '<div class="route-top"><span class="city-tag"><i class="fas fa-map-marker-alt"></i> '+r.city+'</span><span class="price">'+r.price+'</span></div>'+
        '<h4>'+r.name+'</h4><div class="hl">'+r.hl+'</div>'+
        '<div class="route-tags">'+r.tags.map(function(x){return '<span class="rtag">'+x+'</span>';}).join('')+'<span class="rtag">'+r.days+'</span></div>'+
        '<a class="route-link">查看线路详情 →</a>'+
      '</div>';
    }).join('')+'</section>';
  Array.prototype.forEach.call(document.querySelectorAll('.route-card'),function(el){
    el.onclick=function(){location.hash='#/route/'+el.dataset.t+'/'+el.dataset.i;};
  });
}

function viewRoute(tid,idx){
  var t=THEMES.find(function(x){return x.id===tid;});
  var r=t?t.routes[+idx]:null;
  if(!r){location.hash='#/themes';return;}
  var pd=routeData(r);
  var nodes=pd.nodes.map(function(s){return '<div class="node"><div class="t">'+s.n+'<span class="tag">'+(s.t||'')+'</span></div><div class="d">'+(s.d||'')+'</div></div>';}).join('')
    ||'<div class="node"><div class="d">该城景点节点整理中，可参考下方入口查询。</div></div>';
  var foods=pd.foods.map(function(f){return '<div class="node"><div class="t">'+f.n+'<span class="tag">'+(f.p||'')+'</span></div><div class="d">'+(f.d||'')+'</div></div>';}).join('')
    ||'<div class="node"><div class="d">本地美食清单整理中。</div></div>';
  var traffic=pd.traffic.map(function(x){return '<div class="node"><div class="d"><i class="fas fa-arrow-right" style="color:var(--primary)"></i> '+x+'</div></div>';}).join('')
    ||'<div class="node"><div class="d">该城交通方案整理中，可点下方机票与火车票入口查询班次。</div></div>';
  $('view').innerHTML='<a class="back" href="#/theme/'+t.id+'"><i class="fas fa-arrow-left"></i> 返回「'+t.name+'」线路</a>'+
  '<div class="detail">'+
    '<div class="detail-cover"><h2>'+r.name+'</h2><div class="sub">'+r.city+' · '+r.days+' · '+r.price+(pd.isA?'':' · 轻量参考')+' · 主题：'+t.name+'</div></div>'+
    '<div class="section"><h3><i class="fas fa-star"></i> 线路亮点</h3><div class="node"><div class="d">'+r.hl+'</div><div class="route-tags" style="margin-top:8px">'+r.tags.map(function(x){return '<span class="rtag">'+x+'</span>';}).join('')+'</div></div></div>'+
    '<div class="section"><h3><i class="fas fa-map-location-dot"></i> 景点节点</h3>'+nodes+'</div>'+
    '<div class="section"><h3><i class="fas fa-utensils"></i> 美食推荐</h3>'+foods+'</div>'+
    '<div class="section"><h3><i class="fas fa-plane-departure"></i> 交通安排</h3>'+traffic+
      '<div class="link-grid" style="margin-top:12px">'+
        '<a class="link-card" href="'+pd.flight+'" target="_blank" rel="noopener"><b>携程机票</b><span>查询往返航班</span></a>'+
        '<a class="link-card" href="'+pd.train+'" target="_blank" rel="noopener"><b>12306 火车票</b><span>查询高铁/动车</span></a>'+
      '</div></div>'+
    '<div class="section"><h3><i class="fas fa-link"></i> 预订入口</h3><div class="link-grid">'+
      '<a class="link-card" href="https://you.ctrip.com" target="_blank" rel="noopener"><b>携程景点</b><span>门票与预约查询</span></a>'+
      '<a class="link-card" href="'+pd.hotelsUrl+'" target="_blank" rel="noopener"><b>携程酒店</b><span>查询住宿价格</span></a>'+
      '<a class="link-card" href="https://www.12306.cn" target="_blank" rel="noopener"><b>12306</b><span>火车票预订</span></a>'+
    '</div></div>'+
  '</div>';
}

function route(){
  var h=(location.hash.replace(/^#\//,'')||'themes');
  var seg=h.split('/');
  if(seg[0]==='themes') viewThemes();
  else if(seg[0]==='theme') viewTheme(seg[1]);
  else if(seg[0]==='route') viewRoute(seg[1],seg[2]);
  else viewThemes();
  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
