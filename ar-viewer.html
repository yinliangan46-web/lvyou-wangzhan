<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>拾迹 AR · MYL 旅行</title>

<!-- importmap: THREE.js + MindAR 从 CDN 加载 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
<!-- 兜底：window.THREE 如果 importmap 失败 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
    overflow: hidden;
  }
  #ar-root { position: fixed; inset: 0; }
  #ar-camera { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ===== 顶部状态栏 ===== */
  .ar-topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    display: flex; align-items: center; justify-content: space-between;
    z-index: 20; pointer-events: none;
  }
  .ar-title {
    font-size: 14px; font-weight: 600;
    pointer-events: auto;
  }
  .ar-title .name { color: #ffd700; }
  .ar-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 12px;
    background: rgba(255,215,0,0.2); color: #ffd700;
    backdrop-filter: blur(8px);
  }

  /* ===== 底部：线索进度 + 提示 ===== */
  .ar-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom));
    z-index: 20; pointer-events: none;
  }
  .ar-progress {
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 12px; padding: 12px 16px;
    pointer-events: auto;
  }
  .ar-progress-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 600; margin-bottom: 8px;
  }
  .ar-progress-bar {
    height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;
  }
  .ar-progress-fill {
    height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00);
    width: 0%; transition: width 0.3s; border-radius: 3px;
  }
  .ar-hint {
    margin-top: 10px; font-size: 12px; color: #94a3b8;
    min-height: 16px;
  }

  /* ===== 对话气泡（原神式） ===== */
  .hp-bubble {
    position: absolute; left: 16px; right: 16px; top: 30%;
    background: linear-gradient(135deg, rgba(13,17,23,0.95), rgba(30,41,59,0.95));
    border: 1px solid rgba(255,215,0,0.4); border-radius: 16px;
    padding: 14px 16px;
    display: flex; gap: 12px;
    transform: translateY(20px); opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    z-index: 30;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .hp-bubble.hp-in { transform: translateY(0); opacity: 1; }
  .hp-avatar {
    font-size: 32px; width: 44px; height: 44px; flex-shrink: 0;
    background: rgba(255,215,0,0.15); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .hp-content { flex: 1; min-width: 0; }
  .hp-speaker {
    font-size: 11px; color: #ffd700; font-weight: 600;
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .hp-text { font-size: 15px; line-height: 1.5; color: #f1f5f9; }
  .hp-hint {
    margin-top: 10px; font-size: 12px; color: #fbbf24;
    background: rgba(251,191,36,0.1); padding: 6px 10px; border-radius: 6px;
  }

  /* ===== Toast ===== */
  .hp-toast {
    position: absolute; left: 50%; transform: translateX(-50%) translateY(-30px);
    top: 20%;
    background: rgba(0,0,0,0.9); color: #ffd700;
    padding: 10px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 600;
    opacity: 0; transition: all 0.3s;
    z-index: 40; border: 1px solid rgba(255,215,0,0.5);
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .hp-toast.hp-in { transform: translateX(-50%) translateY(0); opacity: 1; }
  .hp-toast.hp-success { color: #4ade80; border-color: #4ade80; }

  /* ===== 印记弹窗 ===== */
  .hp-stamp-modal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.3s; z-index: 100;
  }
  .hp-stamp-modal.hp-in { opacity: 1; }
  .hp-stamp-inner {
    width: 280px; padding: 32px 24px; border-radius: 20px;
    text-align: center; color: #fff;
    transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .hp-stamp-modal.hp-in .hp-stamp-inner { transform: scale(1); }
  .hp-stamp-icon { font-size: 56px; margin-bottom: 12px; }
  .hp-stamp-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .hp-stamp-desc { font-size: 13px; opacity: 0.85; margin-bottom: 20px; }
  .hp-stamp-close {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; padding: 10px 28px; border-radius: 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* ===== 加载/错误遮罩 ===== */
  .ar-splash {
    position: absolute; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0d1117 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    transition: opacity 0.5s;
  }
  .ar-splash.hidden { opacity: 0; pointer-events: none; }
  .ar-splash .logo { font-size: 48px; margin-bottom: 16px; }
  .ar-splash .title { font-size: 22px; font-weight: 700; color: #ffd700; margin-bottom: 8px; }
  .ar-splash .sub { font-size: 14px; color: #94a3b8; max-width: 320px; line-height: 1.6; }
  .ar-splash .spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,215,0,0.2);
    border-top-color: #ffd700; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 24px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ar-btn {
    display: inline-block; margin-top: 16px;
    background: #ffd700; color: #1a0a00; border: none; border-radius: 24px;
    padding: 12px 28px; font-size: 15px; font-weight: 700;
    cursor: pointer; text-decoration: none;
  }

  /* ===== AR 识别提示 ===== */
  .ar-scan-hint {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%);
    z-index: 10; text-align: center;
    pointer-events: none; transition: opacity 0.4s;
  }
  .ar-scan-hint.hidden { opacity: 0; }
  .ar-finder {
    width: 200px; height: 140px; border: 2px solid rgba(255,215,0,0.4);
    border-radius: 12px; position: relative; margin: 0 auto 12px;
  }
  .ar-finder::before, .ar-finder::after {
    content: ''; position: absolute; width: 24px; height: 24px;
    border-color: #ffd700; border-style: solid;
  }
  .ar-finder::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
  .ar-finder::after { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 12px 0; }
  .ar-finder .crosshair {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: rgba(255,215,0,0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .ar-scan-text { font-size: 14px; color: #ffd700; font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

  /* ===== 语音开关 ===== */
  .ar-mic-toggle {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.2); color: #fff;
    font-size: 16px; z-index: 25; cursor: pointer;
  }
  .ar-mic-toggle.muted { opacity: 0.5; }
</style>
</head>

<body>

<!-- MindAR 视频流容器 -->
<div id="ar-root">
  <video id="ar-camera" autoplay playsinline muted></video>
</div>

<!-- 顶部状态栏 -->
<div class="ar-topbar">
  <div class="ar-title">
    <span class="name" id="arPoiName">加载中…</span>
    <span class="ar-badge" id="arStampStatus"></span>
  </div>
</div>

<!-- 语音开关 -->
<button class="ar-mic-toggle" id="arMicBtn" title="语音旁白">🔊</button>

<!-- AR 识别提示 -->
<div class="ar-scan-hint" id="arScanHint">
  <div class="ar-finder"><div class="crosshair">⌖</div></div>
  <div class="ar-scan-text">将摄像头对准景点实景识别图</div>
</div>

<!-- 对话气泡容器 -->
<div id="arPlotBox" style="pointer-events:none"></div>

<!-- 底部进度 + 提示 -->
<div class="ar-bottom">
  <div class="ar-progress">
    <div class="ar-progress-head">
      <span id="arProgressTitle">🗝️ 寻宝进度</span>
      <span id="arProgressCount">0 / 0</span>
    </div>
    <div class="ar-progress-bar"><div class="ar-progress-fill" id="arProgressFill"></div></div>
    <div class="ar-hint" id="arHoverHint"></div>
  </div>
</div>

<!-- 启动 / 错误遮罩 -->
<div class="ar-splash" id="arSplash">
  <div class="logo">🔍</div>
  <div class="title" id="arSplashTitle">拾迹 AR · 故事导览</div>
  <div class="spinner" id="arSpinner"></div>
  <div class="sub" id="arSplashText">
    正在请求摄像头权限并加载识别图<br>
    请允许浏览器使用摄像头
  </div>
  <button class="ar-btn hidden" id="arRetryBtn" style="display:none">重试</button>
  <a class="ar-btn hidden" id="arFallbackBtn" style="display:none" href="javascript:void(0)">查看备用版本</a>
</div>

<script>
/* ============ 全局依赖检查 ============ */
if (!window.THREE) {
  // CDN 脚本标签兜底
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
  document.head.appendChild(s);
}

/* ============ URL 参数 ============ */
var params = new URLSearchParams(location.search);
var poiId = params.get('poi') || 'gugong';
var mode = params.get('mode') || 'auto';  // ar | fallback | auto

/* ============ 加载依赖脚本 ============ */
function loadScript(url) {
  return new Promise(function(resolve, reject) {
    if (document.querySelector('script[src="' + url + '"]')) { resolve(); return; }
    var s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

function loadModule(url) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.type = 'module'; s.src = url;
    s.async = true;
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
    // module 没有明确 onload 等待，500ms 后 resolve
    setTimeout(resolve, 800);
  });
}

/* ============ 获取景点数据 ============ */
var POIS = window.AR_POIS || [];
var STORIES = POIS.find(function(p){ return p.id === poiId; }) || POIS[0];

document.getElementById('arPoiName').textContent = STORIES ? STORIES.name : '未知景点';

/* ============ 状态 ============ */
var THREE = null;
var engine = null;
var scene, camera, renderer, markerGroup, coordGroup;
var arController;
var running = false;

/* ============ 语音开关 ============ */
var micBtn = document.getElementById('arMicBtn');
if (micBtn) {
  micBtn.onclick = function() {
    var muted = micBtn.classList.toggle('muted');
    if (engine && engine._plot) engine._plot.voiceEnabled = !muted;
    micBtn.textContent = muted ? '🔇' : '🔊';
  };
}

/* ============ 进度 UI 更新 ============ */
function updateProgressUI() {
  if (!engine) return;
  var total = engine._artifacts.length;
  var found = engine._artifacts.filter(function(e){ return e.found; }).length;
  var fill = document.getElementById('arProgressFill');
  var count = document.getElementById('arProgressCount');
  var title = document.getElementById('arProgressTitle');
  if (fill) fill.style.width = (found / Math.max(1, total) * 100) + '%';
  if (count) count.textContent = found + ' / ' + total;
  if (title) {
    if (found === total) title.textContent = '🏆 寻宝完成！';
    else if (found === 0) title.textContent = '🗝️ 开始寻宝';
    else title.textContent = '🗝️ 已找到 ' + found;
  }

  // 印记状态
  var stampBadge = document.getElementById('arStampStatus');
  if (stampBadge && STORIES && window.HuntStorage) {
    stampBadge.textContent = window.HuntStorage.hasStamp(STORIES.stamp.id) ? '✅ 已集齐' : '🎯 待收集';
  }
}

/* ============ MindAR + Three.js AR 初始化 ============ */
async function startAR() {
  var splash = document.getElementById('arSplash');
  var splashTitle = document.getElementById('arSplashTitle');
  var splashText = document.getElementById('arSplashText');
  var spinner = document.getElementById('arSpinner');
  var retryBtn = document.getElementById('arRetryBtn');

  splashTitle.textContent = '加载 MindAR 引擎...';
  splashText.innerHTML = '正在初始化 WebAR 组件<br>请稍等';

  try {
    // 1. 加载 Three.js
    if (!window.THREE) {
      await loadScript('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js');
    }
    THREE = window.THREE;

    // 2. 加载 MindAR
    splashTitle.textContent = '加载 MindAR 识别...';
    await loadScript('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
    await loadScript('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js');

    // 3. 加载数据和引擎
    if (!window.AR_POIS) await loadScript('ar-stories.js');
    if (!window.HuntEngine) await loadScript('hunt-engine.js');

    // 重新取 POI（因为可能刚加载）
    POIS = window.AR_POIS || [];
    STORIES = POIS.find(function(p){ return p.id === poiId; }) || POIS[0];

    splashTitle.textContent = '请求摄像头权限...';
    splashText.innerHTML = '将摄像头对准景点实景<br>首次使用需允许浏览器调用摄像头';

    // 4. MindAR Image Tracking 配置
    var markerUrl = STORIES.markerUrl || 'markers/' + poiId + '.mind';

    arController = new window.MINDAR.Image.Controller({
      container: document.getElementById('ar-root'),
      imageTargetSrc: markerUrl,
      uiOverlay: { display: 'none' },    // 我们自己做 UI
      videoSettings: {
        video: document.getElementById('ar-camera'),
        facing: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    // 5. Three.js 初始化
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);  // 透明，底下显示摄像头视频

    var arRoot = document.getElementById('ar-root');
    arRoot.appendChild(renderer.domElement);
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.zIndex = '5';

    // 6. 灯光（MeshStandardMaterial 需要光照才可见）
    var ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    var dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(1, 2, 1);
    scene.add(dir);

    // 7. 绑定 MindAR controller
    arController.addMarkerBinder('marker', {
      onTargetFound: function(target) {
        console.log('[AR] 识别到标记！', target);
        document.getElementById('arScanHint').classList.add('hidden');

        // anchor group 由 MindAR-THREE 自动创建
        markerGroup = target.group;

        // 坐标系转换：MindAR 锚点 XY 平面，我们让物体竖直
        coordGroup = new THREE.Group();
        coordGroup.rotation.x = -Math.PI / 2;
        coordGroup.rotation.z = Math.PI;
        markerGroup.add(coordGroup);

        scene.add(target.scene);

        // 绑定 HuntEngine
        engine.bindScene(scene, document.getElementById('arPlotBox'), document.getElementById('arHoverHint'));
        engine.bindMarkerGroup(coordGroup);
        engine.start(STORIES);
        updateProgressUI();
      },
      onTargetLost: function() {
        console.log('[AR] 标记丢失');
        document.getElementById('arScanHint').classList.remove('hidden');
      }
    });

    arController.start();

    // 隐藏启动遮罩
    splash.classList.add('hidden');

    // 8. 渲染循环
    var clock = new THREE.Clock();
    running = true;
    function animate() {
      if (!running) return;
      requestAnimationFrame(animate);
      var delta = clock.getDelta();

      if (markerGroup && coordGroup) {
        camera = arController.getThreeCamera();
      }

      if (engine) {
        engine.animate(delta, camera);
        engine.updateParticles(delta);
        updateProgressUI();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function() {
      if (!renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  } catch(err) {
    console.error('[AR] 启动失败:', err);
    splashTitle.textContent = '⚠️ 启动失败';
    splashText.innerHTML = err.message || String(err);
    spinner.style.display = 'none';
    retryBtn.style.display = 'inline-block';
    retryBtn.onclick = function() { location.reload(); };
  }
}

/* ============ 启动 HuntEngine 占位 ============ */
// 即使 AR 初始化失败，engine 也要有实例（用于 UI 渲染）
if (!engine && window.HuntEngine) {
  engine = new window.HuntEngine();
}

/* ============ 页面加载完成 ============ */
window.addEventListener('load', function() {
  // 检查 HTTPS（摄像头权限要求）
  var isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure) {
    document.getElementById('arSplashText').innerHTML =
      '⚠️ 摄像头需要 HTTPS<br>请在 GitHub Pages 上打开，或本地用 <code>https-server</code>';
    document.getElementById('arSpinner').style.display = 'none';
    return;
  }

  startAR();
});

/* ============ 页面卸载清理 ============ */
window.addEventListener('beforeunload', function() {
  running = false;
  try { if (arController) arController.stop(); } catch(e){}
  try { window.speechSynthesis.cancel(); } catch(e){}
  if (renderer) renderer.dispose();
});
</script>
</body>
</html>
