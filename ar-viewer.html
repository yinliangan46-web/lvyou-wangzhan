<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;color:#fff}
button{font-family:inherit;cursor:pointer;border:none;outline:none}

#topBar{position:fixed;top:0;left:0;right:0;z-index:10;padding:max(14px,env(safe-area-inset-top)) 16px 14px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);display:flex;align-items:center;justify-content:space-between;pointer-events:none}

#infoCard{position:fixed;left:16px;right:16px;bottom:20px;z-index:15;background:rgba(15,23,42,.95);backdrop-filter:blur(16px);border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:18px;max-width:500px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}

#gamePanel .game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

#loading{position:fixed;inset:0;z-index:30;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading .spinner{width:48px;height:48px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const POI_ID = params.get('poi') || 'gugong';
const POI = (window.AR_POIS && window.AR_POIS.find(p => p.id === POI_ID)) ||
           (window.AR_POIS && window.AR_POIS[0]);

const HuntStorage = {
  LS: 'myl_hunt_stamps_v3',
  get() { try { return JSON.parse(localStorage.getItem(this.LS) || '[]'); } catch(e) { return []; } },
  add(id) { const a = this.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(this.LS, JSON.stringify(a)); } }
};

let scene, camera, renderer, controls, composer;
let poiGroup;
let hotspotObjects = [];
const visitedHotspots = new Set();
let autoRotate = true;
const gameState = { active: false, completed: false };
let raycaster, pointer, clouds, particles;

function makeTex(drawFn, rx=2, ry=2) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d'); drawFn(ctx, 256);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = 8;
  return t;
}
function brickTex(base, line) {
  return makeTex((ctx, s) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = line || 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
    const bh = 32, bw = 64;
    for (let y = 0; y < s; y += bh) {
      const off = ((y/bh)%2===0) ? 0 : bw/2;
      for (let x = -bw; x < s+bw; x += bw) ctx.strokeRect(x+off, y, bw, bh);
    }
    for (let i = 0; i < 200; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.06})`;
      ctx.fillRect(Math.random()*s, Math.random()*s, 3, 3);
    }
  }, 4, 2);
}
function roofTileTex() {
  return makeTex((ctx, s) => {
    for (let x = 0; x < s; x += 16) {
      const g = ctx.createLinearGradient(x, 0, x+16, 0);
      g.addColorStop(0, '#9a7a15'); g.addColorStop(0.5, '#e6c24a'); g.addColorStop(1, '#9a7a15');
      ctx.fillStyle = g; ctx.fillRect(x, 0, 16, s);
    }
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    for (let y = 0; y < s; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(s,y); ctx.stroke(); }
  }, 6, 3);
}
function stoneTex() {
  return makeTex((ctx, s) => {
    ctx.fillStyle = '#d0ccc4'; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 300; i++) {
      const v = 180 + Math.random()*40;
      ctx.fillStyle = `rgba(${v},${v},${v},.3)`;
      ctx.fillRect(Math.random()*s, Math.random()*s, 4, 4);
    }
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    for (let y = 0; y < s; y += 64) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(s,y); ctx.stroke(); }
  }, 2, 2);
}
function woodTex(base) {
  return makeTex((ctx, s) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 50; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${Math.random()*0.1})`;
      ctx.beginPath();
      ctx.moveTo(0, Math.random()*s);
      ctx.bezierCurveTo(s/3, Math.random()*s, s*2/3, Math.random()*s, s, Math.random()*s);
      ctx.stroke();
    }
  }, 2, 1);
}

const MATS = {};
function initMats() {
  MATS.redWall = new THREE.MeshStandardMaterial({ map: brickTex('#9a1a1a','rgba(0,0,0,.2)'), roughness: .6, metalness: .1 });
  MATS.goldRoof = new THREE.MeshStandardMaterial({ map: roofTileTex(), roughness: .25, metalness: .8, envMapIntensity: 1.2 });
  MATS.whiteStone = new THREE.MeshStandardMaterial({ map: stoneTex(), roughness: .5, metalness: .05 });
  MATS.darkStone = new THREE.MeshStandardMaterial({ color: 0x8a8680, roughness: .8 });
  MATS.redPillar = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: .35, metalness: .15 });
  MATS.goldDoor = new THREE.MeshStandardMaterial({ color: 0xd4a843, roughness: .3, metalness: .7, envMapIntensity: 1.5 });
  MATS.clay = new THREE.MeshStandardMaterial({ color: 0xa08060, roughness: .85 });
  MATS.clayDark = new THREE.MeshStandardMaterial({ color: 0x8a6f50, roughness: .9 });
  MATS.water = new THREE.MeshStandardMaterial({ color: 0x2a6fa8, roughness: .1, metalness: .6, transparent: true, opacity: .8, envMapIntensity: 1.5 });
  MATS.grass = new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: .9 });
  MATS.rock = new THREE.MeshStandardMaterial({ color: 0x5a6578, roughness: .95 });
  MATS.snow = new THREE.MeshStandardMaterial({ color: 0xf5f8fc, roughness: .3, metalness: .05 });
  MATS.potalaWhite = new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: .45 });
  MATS.potalaRed = new THREE.MeshStandardMaterial({ color: 0x8a1a1a, roughness: .5 });
  MATS.gold = new THREE.MeshStandardMaterial({ color: 0xd4a843, roughness: .15, metalness: .95, envMapIntensity: 2 });
  MATS.darkWood = new THREE.MeshStandardMaterial({ map: woodTex('#6b4423'), roughness: .7 });
}

function buildPOIModel(poi) {
  const g = new THREE.Group();
  initMats();
  switch(poi.id) {
    case 'gugong': g.add(buildGugong()); break;
    case 'bingmayong': g.add(buildBingmayong()); break;
    case 'xihu': g.add(buildXihu()); break;
    case 'zhongshan': g.add(buildZhongshan()); break;
    case 'yulong': g.add(buildYulong()); break;
    case 'potala': g.add(buildPotala()); break;
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  markGameTargets(g, poi.id);
  const box = new THREE.Box3().setFromObject(g);
  g.position.x = -(box.min.x + box.max.x) / 2;
  g.position.z = -(box.min.z + box.max.z) / 2;
  g.position.y = -box.min.y;
  return g;
}

function markGameTargets(g, poiId) {
  const targets = {
    gugong: ['找到太和殿屋脊上的脊兽','找到金色的大门','找到汉白玉台基','找到红色的立柱','找到金色的屋顶'],
    bingmayong: ['找到将军俑（最高大的）','找到持弩的弓箭手','找到带盔甲的武士俑','找到梳发髻的俑','找到俑坑的隔墙'],
    xihu: ['找到断桥','找到雷峰塔','找到湖边的柳树','找到西湖水面','找到桥的栏杆'],
    zhongshan: ['找到博爱坊（石牌坊）','找到392级台阶','找到祭堂','找到牌坊的立柱','找到蓝色琉璃瓦顶'],
    yulong: ['找到玉龙雪山主峰','找到雪顶','找到蓝月谷','找到东巴石碑','找到灰色岩壁'],
    potala: ['找到布达拉宫的金顶','找到白宫（白色部分）','找到红宫（红色部分）','找到墙上的窗户','找到金顶上的小金塔']
  };
  const poiTargets = targets[poiId] || [];
  let idx = 0;
  g.traverse(o => {
    if (o.isMesh && idx < poiTargets.length) {
      o.userData.gameTarget = true;
      o.userData.gameIdx = idx;
      o.userData.desc = poiTargets[idx];
      idx++;
    }
  });
}

function buildGugong() {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const w = 5 - i*0.6, d = 4 - i*0.5;
    const base = new THREE.Mesh(new THREE.BoxGeometry(w, .35, d), MATS.whiteStone);
    base.position.y = i*.38 + .17; g.add(base);
    const railH = .18, railY = i*.38 + .44;
    const rf = new THREE.Mesh(new THREE.BoxGeometry(w, railH, .04), MATS.whiteStone);
    rf.position.set(0, railY, d/2); g.add(rf);
    const rb = rf.clone(); rb.position.z = -d/2; g.add(rb);
    const rl = new THREE.Mesh(new THREE.BoxGeometry(.04, railH, d), MATS.whiteStone);
    rl.position.set(-w/2, railY, 0); g.add(rl);
    const rr = rl.clone(); rr.position.x = w/2; g.add(rr);
    for (let x = -w/2+.3; x < w/2; x += .5) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.15,6), MATS.whiteStone);
      p.position.set(x, railY+.15, d/2); g.add(p);
      const p2 = p.clone(); p2.position.z = -d/2; g.add(p2);
    }
  }
  for (let i = 0; i < 5; i++) {
    const step = new THREE.Mesh(new THREE.BoxGeometry(1.2, .1, .5), MATS.darkStone);
    step.position.set(0, i*.1+.05, 2+i*.3); g.add(step);
  }
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2, 2.5), MATS.redWall);
  body.position.y = 1.15 + 1.14; g.add(body);
  for (let i = -2; i <= 2; i++) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.2,12), MATS.redPillar);
    p.position.set(i*.65, 1.15+1.14, 1.3); g.add(p);
  }
  for (let i = -1.5; i <= 1.5; i += 1) {
    const door = new THREE.Mesh(new THREE.BoxGeometry(.6, 1.5, .05), MATS.goldDoor);
    door.position.set(i, 1.15+1.14, 1.26); g.add(door);
  }
  const roofY = 1.15+1.14+1.45;
  const roof1 = new THREE.Mesh(new THREE.ConeGeometry(2.8, .9, 4), MATS.goldRoof);
  roof1.rotation.y = Math.PI/4; roof1.position.y = roofY; g.add(roof1);
  const roof2 = new THREE.Mesh(new THREE.ConeGeometry(2.2, .8, 4), MATS.goldRoof);
  roof2.rotation.y = Math.PI/4; roof2.position.y = roofY + 1.3; g.add(roof2);
  for (let i = 0; i < 10; i++) {
    const beast = new THREE.Mesh(new THREE.BoxGeometry(.06,.12,.06), MATS.gold);
    beast.position.set(-1.1+i*.24, roofY+.4, 0); g.add(beast);
  }
  const chiwen = new THREE.Mesh(new THREE.BoxGeometry(.15,.2,.1), MATS.gold);
  chiwen.position.set(0, roofY+.45, 1.8); g.add(chiwen);
  const chiwen2 = chiwen.clone(); chiwen2.position.z = -1.8; g.add(chiwen2);
  return g;
}

function createHotspots(poi) {
  hotspotObjects = [];
  const hotspots = poi.hotspots || [];
  document.getElementById('hsTotal').textContent = hotspots.length;
  const labelsDiv = document.getElementById('labels');
  hotspots.forEach(hs => {
    const anchor = new THREE.Object3D();
    anchor.position.set(hs.position[0], hs.position[1], hs.position[2]);
    poiGroup.add(anchor);
    const tag = document.createElement('div');
    tag.className = 'hotspot-tag'; tag.textContent = '📌'; tag.dataset.hsId = hs.id;
    tag.onclick = () => showInfoCard(hs);
    labelsDiv.appendChild(tag);
    hotspotObjects.push({ anchor, tag, data: hs });
  });
}
function updateHotspotPositions() {
  const w = window.innerWidth, h = window.innerHeight;
  hotspotObjects.forEach(hs => {
    const worldPos = new THREE.Vector3();
    hs.anchor.getWorldPosition(worldPos);
    const projected = worldPos.project(camera);
    const x = (projected.x * .5 + .5) * w, y = (-projected.y * .5 + .5) * h;
    if (projected.z > 1) { hs.tag.style.display = 'none'; }
    else { hs.tag.style.display = 'flex'; hs.tag.style.left = x + 'px'; hs.tag.style.top = y + 'px'; }
  });
}
function showInfoCard(hs) {
  visitedHotspots.add(hs.id);
  document.getElementById('hsSeen').textContent = visitedHotspots.size;
  const tag = document.querySelector(`.hotspot-tag[data-hs-id="${hs.id}"]`);
  if (tag) tag.classList.add('visited');
  document.getElementById('infoTitle').textContent = hs.title;
  document.getElementById('infoText').textContent = hs.text;
  document.getElementById('infoCard').classList.add('visible');
  document.getElementById('gameEntry').style.display = 'none';
}
function closeInfoCard() {
  document.getElementById('infoCard').classList.remove('visible');
  if (!gameState.completed) document.getElementById('gameEntry').style.display = 'flex';
}

let storyIdx = 0, storyLines = [], storyTimer = null;

const ExploreGame = {
  targets: [], currentIdx: 0, found: 0, total: 5,
  start() {
    this.targets = []; this.currentIdx = 0; this.found = 0;
    poiGroup.traverse(o => { if (o.isMesh && o.userData.gameTarget) this.targets.push(o); });
    this.total = Math.min(5, this.targets.length);
    for (let i = this.targets.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.targets[i], this.targets[j]] = [this.targets[j], this.targets[i]];
    }
    this.targets = this.targets.slice(0, this.total);
    this.showNextTarget();
  },
  showNextTarget() {
    if (this.currentIdx >= this.total) { this.complete(); return; }
    const target = this.targets[this.currentIdx];
    const descEl = document.getElementById('exploreDesc');
    if (descEl) descEl.textContent = `在 3D 场景中找到：${target.userData.desc}（${this.found}/${this.total}）`;
    GameEngine.setProgress(Math.round(this.found / this.total * 100));
    target.material.emissive = new THREE.Color(0xfbbf24);
    target.material.emissiveIntensity = 0.3;
    setTimeout(() => { if (target.material.emissive) target.material.emissiveIntensity = 0; }, 1500);
  },
  onHit(hitMesh) {
    const target = this.targets[this.currentIdx];
    if (hitMesh === target) {
      hitMesh.material.emissive = new THREE.Color(0x22c55e);
      hitMesh.material.emissiveIntensity = 0.5;
      setTimeout(() => { hitMesh.material.emissiveIntensity = 0; }, 500);
      this.found++; toast(`✅ 找到了！（${this.found}/${this.total}）`);
      this.currentIdx++;
      setTimeout(() => this.showNextTarget(), 800);
    } else {
      toast('❌ 不是这个，再转转看看');
      hitMesh.material.emissive = new THREE.Color(0xef4444);
      hitMesh.material.emissiveIntensity = 0.3;
      setTimeout(() => { hitMesh.material.emissiveIntensity = 0; }, 400);
    }
  },
  complete() { GameEngine.complete(); }
};

function onGameTargetHit(hitMesh) {
  if (gameState.active) ExploreGame.onHit(hitMesh);
}

function init() {
  document.getElementById('poiTitle').textContent = POI.name;
  document.getElementById('poiSub').textContent = POI.subtitle || '';
  const canvas = document.getElementById('scene');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  const camPos = (POI.scene && POI.scene.cameraPos) || [0, 2.5, 6];
  const lookAt = (POI.scene && POI.scene.cameraLookAt) || [0, 1.5, 0];
  camera.position.set(camPos[0], camPos[1], camPos[2]);
  camera.lookAt(lookAt[0], lookAt[1], lookAt[2]);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  scene.fog = new THREE.Fog(0x0a0a0a, 10, 25);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));
  const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
  sun.position.set(5, 8, 5); sun.castShadow = true;
  sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
  sun.shadow.camera.right = sun.shadow.camera.top = 8;
  sun.shadow.bias = -0.001;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xa5b4fc, 0.4);
  fill.position.set(-3, 3, -5); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffd700, 0.5);
  rim.position.set(0, 5, -8); scene.add(rim);
  poiGroup = buildPOIModel(POI);
  scene.add(poiGroup);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9, metalness: 0.1 });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 64), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  clouds = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const cloud = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random()*0.2, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.15, roughness: 1 }));
    cloud.position.set((Math.random() - 0.5) * 12, 4 + Math.random() * 2, (Math.random() - 0.5) * 12);
    cloud.userData.speed = 0.002 + Math.random() * 0.003;
    clouds.add(cloud);
  }
  scene.add(clouds);
  const particleCount = 200;
  const particleGeo = new THREE.BufferGeometry();
  const posArray = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount * 3; i += 3) {
    posArray[i] = (Math.random() - 0.5) * 10;
    posArray[i+1] = Math.random() * 5;
    posArray[i+2] = (Math.random() - 0.5) * 10;
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xfbbf24, size: 0.03, transparent: true, opacity: 0.6 }));
  scene.add(particles);
  createHotspots(POI);
  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  let downPos = null;
  canvas.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', (e) => {
    if (!downPos) return;
    const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    if (Math.sqrt(dx*dx + dy*dy) > 8) return;
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(poiGroup.children, true);
    if (intersects.length > 0) {
      const hit = intersects[0].object;
      if (hit.userData.gameTarget && gameState.active) onGameTargetHit(hit);
    }
  });
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.05;
  controls.minDistance = 2; controls.maxDistance = 15;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.target.set(lookAt[0], lookAt[1], lookAt[2]);
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.3, 0.4, 0.85);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
  GameEngine.init();
  document.getElementById('btnStory').addEventListener('click', () => playStory(POI.plot || []));
  document.getElementById('btnRotate').addEventListener('click', function() {
    autoRotate = !autoRotate;
    this.style.background = autoRotate ? 'rgba(251,191,36,.3)' : 'rgba(255,255,255,.15)';
  });
  document.getElementById('loading').style.display = 'none';
  setTimeout(() => playStory(POI.plot || []), 600);
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (poiGroup && autoRotate && !gameState.active) poiGroup.rotation.y += 0.003;
  if (controls) controls.update();
  if (clouds) clouds.children.forEach(c => { c.position.x += c.userData.speed; if (c.position.x > 8) c.position.x = -8; });
  if (particles) {
    const pos = particles.geometry.attributes.position.array;
    for (let i = 0; i < pos.length; i += 3) { pos[i+1] += 0.002; if (pos[i+1] > 5) pos[i+1] = 0; }
    particles.geometry.attributes.position.needsUpdate = true;
  }
  updateHotspotPositions();
  composer.render();
}

init();
</script>
