<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>AR 空间 · 拾迹</title>
<script src="ar-lib/three.min.js"></script>
<script src="touch-controls.js"></script>
<script src="ar-stories.js"></script>
<script src="hunt-engine.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;color:#fff}
button{font-family:inherit}

/* ===== 摄像头背景 + Three.js 叠加 ===== */
#arVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transform:scaleX(-1)}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;touch-action:none}

/* ===== 顶部状态栏 ===== */
#arTopBar{position:fixed;top:0;left:0;right:0;z-index:10;
  padding:max(14px,env(safe-area-inset-top)) 16px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
  display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#arTopBar>*{pointer-events:auto}
.ar-title{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;
  text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ar-title .dot{width:8px;height:8px;background:#22c55e;border-radius:50%;
  box-shadow:0 0 10px #22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ar-btns{display:flex;gap:8px}
.ar-btns button{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;
  padding:8px 14px;font-size:13px;cursor:pointer;transition:.2s}
.ar-btns button:active{transform:scale(.95);background:rgba(255,255,255,.25)}

/* ===== 加载/错误 ===== */
#arLoading,#arError,#arNoCam{position:fixed;inset:0;z-index:30;
  background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#arLoading .spinner{width:48px;height:48px;border:3px solid rgba(99,102,241,.2);
  border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#arLoading .text,#arError .text,#arNoCam .text{font-size:14px;color:#94a3b8;line-height:1.6}
#arError .text b,#arNoCam .text b{color:#fff}
#arError button,#arNoCam button{background:#6366f1;color:#fff;border:none;border-radius:8px;
  padding:10px 24px;font-size:14px;cursor:pointer}
#arError button:active,#arNoCam button:active{transform:scale(.96)}

/* ===== 故事气泡 ===== */
#arBubble{position:fixed;left:16px;right:16px;bottom:180px;z-index:10;
  background:rgba(15,23,42,.85);backdrop-filter:blur(14px);border:1px solid rgba(99,102,241,.3);
  border-radius:16px;padding:16px 18px;max-width:600px;margin:0 auto;
  box-shadow:0 10px 40px rgba(99,102,241,.2);
  opacity:0;transform:translateY(20px);transition:opacity .35s,transform .35s}
#arBubble.visible{opacity:1;transform:translateY(0)}
#arBubble .speaker{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#arBubble .avatar{width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;
  justify-content:center;font-size:16px}
#arBubble .name{font-weight:600;font-size:14px;color:#a5b4fc}
#arBubble .text{font-size:15px;line-height:1.7;color:#e2e8f0}
#arBubble .pb{margin-top:12px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#arBubble .pb>div{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);width:0;transition:width .1s linear}

/* ===== 寻宝进度 ===== */
#arHunt{position:fixed;left:16px;right:16px;bottom:16px;z-index:10;
  background:rgba(15,23,42,.85);backdrop-filter:blur(14px);border:1px solid rgba(245,158,11,.3);
  border-radius:16px;padding:14px 18px;
  box-shadow:0 10px 40px rgba(245,158,11,.15)}
#arHunt .title{font-weight:600;font-size:14px;color:#fbbf24;margin-bottom:10px;display:flex;justify-content:space-between}
#arHunt .title b{color:#fff}
#arHunt .artifacts{display:flex;gap:12px;flex-wrap:wrap}
#arHunt .artifact{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:20px;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.1);transition:.3s;position:relative}
#arHunt .artifact.found{background:linear-gradient(135deg,#f59e0b,#d97706);
  border-color:#fbbf24;transform:scale(1.1)}
#arHunt .artifact.found::after{content:'✓';position:absolute;bottom:-4px;right:-4px;
  background:#22c55e;color:#fff;border-radius:50%;width:18px;height:18px;
  font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #0f172a}

/* ===== Toast ===== */
#arToast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(15,23,42,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);
  border-radius:24px;padding:10px 20px;font-size:14px;z-index:40;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#arToast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 彩蛋/印记弹窗 ===== */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:.3s}
.modal-bg.visible{opacity:1;pointer-events:auto}
.modal{background:linear-gradient(160deg,#1e1b4b,#0f172a);border:1px solid rgba(99,102,241,.4);
  border-radius:20px;padding:28px;text-align:center;max-width:360px;width:100%;
  box-shadow:0 30px 80px rgba(99,102,241,.3);transform:scale(.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.modal-bg.visible .modal{transform:scale(1)}
.modal h2{font-size:20px;margin-bottom:8px;background:linear-gradient(90deg,#a5b4fc,#fbbf24);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal p{color:#a5b4fc;font-size:14px;margin-bottom:16px;line-height:1.6}
.modal .stamp{font-size:72px;margin:10px 0 6px;filter:drop-shadow(0 4px 20px rgba(251,191,36,.4))}
.modal button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;
  border-radius:12px;padding:12px 32px;font-size:15px;font-weight:600;cursor:pointer}
.modal button:active{transform:scale(.96)}
.modal .hint{font-size:12px;color:#64748b;margin-top:10px}

/* ===== 彩蛋切换 ===== */
#arTab{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:10;
  background:rgba(15,23,42,.85);backdrop-filter:blur(14px);border-radius:20px;padding:4px;
  display:flex;gap:2px;border:1px solid rgba(255,255,255,.15)}
#arTab button{background:transparent;border:none;color:#94a3b8;padding:6px 16px;
  font-size:12px;border-radius:16px;cursor:pointer;transition:.2s}
#arTab button.active{background:rgba(99,102,241,.4);color:#fff}
#arTab button.locked{opacity:.4;cursor:not-allowed}

@media (min-width:768px){
  #arBubble{max-width:500px}
}
</style>
</head>
<body>

<!-- 摄像头背景 -->
<video id="arVideo" autoplay playsinline muted></video>

<!-- Three.js 透明叠加 -->
<canvas id="arCanvas"></canvas>

<!-- 顶部状态栏 -->
<div id="arTopBar">
  <div class="ar-title"><span class="dot" id="dotCam"></span><span id="titleText">AR 空间</span></div>
  <div class="ar-btns">
    <button id="btnStory" title="重放故事">▶ 故事</button>
    <button id="btnReset" title="重置视角">↺</button>
    <button id="btnMic" title="语音">🔊</button>
  </div>
</div>

<!-- 彩蛋/主线 Tab -->
<div id="arTab">
  <button id="tabMain" class="active">📖 主线故事</button>
  <button id="tabEgg" class="locked">🎭 隐藏彩蛋 🔒</button>
</div>

<!-- 故事气泡 -->
<div id="arBubble">
  <div class="speaker">
    <div class="avatar" id="bAv">👤</div>
    <div class="name" id="bName">旁白</div>
  </div>
  <div class="text" id="bText">...</div>
  <div class="pb"><div id="bPb"></div></div>
</div>

<!-- 寻宝进度 -->
<div id="arHunt">
  <div class="title">🔍 拾迹寻宝 <span id="huntTitle"><b id="huntFound">0</b>/<b id="huntTotal">0</b></span></div>
  <div class="artifacts" id="huntList"></div>
</div>

<!-- Toast -->
<div id="arToast"></div>

<!-- 加载 -->
<div id="arLoading">
  <div class="spinner"></div>
  <div class="text">启动 AR 空间中...<br /><span id="loadSub">请求摄像头权限</span></div>
</div>

<!-- 无摄像头降级 -->
<div id="arNoCam" style="display:none">
  <div class="spinner" style="border-top-color:#8b5cf6"></div>
  <div class="text"><b>预览模式</b><br />当前环境无法使用摄像头<br />已自动进入 3D 模型预览</div>
  <button onclick="location.reload()">重新加载</button>
</div>

<!-- 印记弹窗 -->
<div class="modal-bg" id="modalStamp">
  <div class="modal">
    <div class="stamp" id="stampIcon">🏛️</div>
    <h2 id="stampTitle">拾迹印记已解锁！</h2>
    <p id="stampDesc">集齐了全部线索，获得专属印记</p>
    <button onclick="location.href='album.html'">去集册查看</button>
    <div class="hint">印记已自动存入拾迹集册</div>
  </div>
</div>

<!-- 彩蛋解锁弹窗 -->
<div class="modal-bg" id="modalEgg">
  <div class="modal">
    <div class="stamp" style="font-size:56px">🎭</div>
    <h2>隐藏彩蛋已解锁！</h2>
    <p id="eggDesc">发现了一个隐藏的秘密...</p>
    <button onclick="document.getElementById('modalEgg').classList.remove('visible'); document.getElementById('tabEgg').classList.remove('locked'); document.getElementById('tabEgg').textContent='🎭 隐藏彩蛋';">继续探索</button>
  </div>
</div>

<script>
'use strict';

/* ============ 配置 ============ */
var params = new URLSearchParams(location.search);
var POI_ID = params.get('poi') || 'gugong';
var POI = (window.STORIES && window.STORIES.find(function(p){ return p.id === POI_ID; })) ||
          (window.STORIES && window.STORIES[0]);

/* ============ 全局变量 ============ */
var scene, camera, renderer, controls;
var poiGroup, artifacts = [];
var storyTimer, currentTab = 'main';
var huntState = { found: new Set(), total: 0 };
var voiceOn = true;

/* ============ 3D 模型生成（每种景点独特） ============ */
function buildPOIModel(poi) {
  var g = new THREE.Group();
  var s = 1.5;  // 基础尺寸

  switch(poi.id) {
    case 'bingmayong': {
      // 兵马俑
      var matBody = new THREE.MeshStandardMaterial({ color: 0xc8a07a, roughness: 0.9 });
      var matHead = new THREE.MeshStandardMaterial({ color: 0xd4b48c, roughness: 0.85 });
      for (var i = 0; i < 8; i++) {
        var body = new THREE.Mesh(new THREE.BoxGeometry(0.55 * s, 1.6 * s, 0.35 * s), matBody);
        body.position.set(((i % 4) - 1.5) * 0.9 * s, 0.8 * s, Math.floor(i / 4) * 1.1 * s);
        g.add(body);
        var head = new THREE.Mesh(new THREE.SphereGeometry(0.2 * s, 16, 12), matHead);
        head.position.copy(body.position).add(new THREE.Vector3(0, 1.6 * s, 0));
        g.add(head);
      }
      break;
    }
    case 'gugong': {
      // 故宫太和殿
      var redMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.5 });
      var goldMat = new THREE.MeshStandardMaterial({ color: 0xf5d76e, metalness: 0.6, roughness: 0.3 });
      var base = new THREE.Mesh(new THREE.BoxGeometry(4 * s, 0.5 * s, 3 * s), redMat);
      base.position.y = 0.25 * s;
      g.add(base);
      var pillarMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.4 });
      for (var i = -2; i <= 2; i++) for (var j = -1; j <= 1; j++) {
        var p = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.12 * s, 2.5 * s, 8), pillarMat);
        p.position.set(i * 0.9 * s, 1.5 * s, j * 1 * s);
        g.add(p);
      }
      var roof = new THREE.Mesh(new THREE.ConeGeometry(3.2 * s, 1.5 * s, 4), goldMat);
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 3.5 * s;
      g.add(roof);
      break;
    }
    case 'xihu': {
      // 西湖：湖面 + 三潭印月
      var waterMat = new THREE.MeshStandardMaterial({ color: 0x2c5f8f, metalness: 0.3, roughness: 0.4 });
      var water = new THREE.Mesh(new THREE.CircleGeometry(3 * s, 32), waterMat);
      water.rotation.x = -Math.PI / 2;
      g.add(water);
      var stoneMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
      for (var i = 0; i < 3; i++) {
        var st = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * s, 0.2 * s, 0.8 * s, 12), stoneMat);
        var a = (i / 3) * Math.PI * 2;
        st.position.set(Math.cos(a) * 1.2 * s, 0.4 * s, Math.sin(a) * 1.2 * s);
        g.add(st);
      }
      break;
    }
    case 'zhongshan': {
      // 中山陵：阶梯 + 牌坊
      var whiteMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.6 });
      for (var i = 0; i < 5; i++) {
        var step = new THREE.Mesh(new THREE.BoxGeometry(3 * s, 0.15 * s, 0.4 * s), whiteMat);
        step.position.y = i * 0.15 * s;
        step.position.z = -i * 0.5 * s;
        g.add(step);
      }
      var hall = new THREE.Mesh(new THREE.BoxGeometry(2 * s, 1.2 * s, 1.5 * s), whiteMat);
      hall.position.set(0, 1.2 * s, -2.5 * s);
      g.add(hall);
      var roof = new THREE.Mesh(new THREE.ConeGeometry(1.3 * s, 0.6 * s, 4), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      roof.rotation.y = Math.PI / 4;
      roof.position.copy(hall.position).add(new THREE.Vector3(0, 0.9 * s, 0));
      g.add(roof);
      break;
    }
    case 'yulong': {
      // 玉龙雪山
      var snowMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4, metalness: 0.1 });
      var rockMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
      var body = new THREE.Mesh(new THREE.ConeGeometry(2 * s, 4 * s, 6), rockMat);
      body.position.y = 2 * s;
      g.add(body);
      var cap = new THREE.Mesh(new THREE.ConeGeometry(0.8 * s, 1.5 * s, 6), snowMat);
      cap.position.y = 4 * s;
      g.add(cap);
      break;
    }
    case 'potala': {
      // 布达拉宫
      var redMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.7 });
      var whiteMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.6 });
      var white = new THREE.Mesh(new THREE.BoxGeometry(3 * s, 2 * s, 1.5 * s), whiteMat);
      white.position.y = 1 * s;
      g.add(white);
      var red = new THREE.Mesh(new THREE.BoxGeometry(1.8 * s, 1.3 * s, 1.2 * s), redMat);
      red.position.set(0, 3.65 * s, 0);
      g.add(red);
      var roof = new THREE.Mesh(new THREE.BoxGeometry(1.9 * s, 0.1 * s, 1.3 * s), new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
      roof.position.copy(red.position).add(new THREE.Vector3(0, 0.7 * s, 0));
      g.add(roof);
      break;
    }
    default: {
      var geo = new THREE.DodecahedronGeometry(0.8 * s, 0);
      var mat = new THREE.MeshStandardMaterial({ color: 0x6366f1, metalness: 0.4, roughness: 0.3 });
      g.add(new THREE.Mesh(geo, mat));
    }
  }

  // 整体居中 + 让底在 y=0
  g.updateMatrixWorld();
  var box = new THREE.Box3().setFromObject(g);
  var cx = (box.min.x + box.max.x) / 2;
  var cz = (box.min.z + box.max.z) / 2;
  var bottom = box.min.y;
  g.position.x = -cx;
  g.position.z = -cz;
  g.position.y = -bottom;

  return g;
}

/* ============ 寻宝线索（漂浮在 3D 空间） ============ */
function spawnArtifacts(poi) {
  var list = (poi.artifacts || []).slice();
  huntState.total = list.length;
  huntState.found.clear();
  document.getElementById('huntTotal').textContent = list.length;
  artifacts = [];

  // 随机在模型周围散布
  var bounds = new THREE.Box3().setFromObject(poiGroup);
  var cx = (bounds.min.x + bounds.max.x) / 2;
  var cy = (bounds.min.y + bounds.max.y) / 2;
  var cz = (bounds.min.z + bounds.max.z) / 2;
  var rangeX = (bounds.max.x - bounds.min.x) / 2 + 0.8;
  var rangeZ = (bounds.max.z - bounds.min.z) / 2 + 0.8;
  var rangeY = (bounds.max.y - bounds.min.y) / 2 + 0.5;

  // 准备 UI 列表
  var huntList = document.getElementById('huntList');
  huntList.innerHTML = '';

  list.forEach(function(a, idx) {
    // 3D 线索物体
    var geo, color;
    switch(a.type) {
      case 'scroll': geo = new THREE.TorusGeometry(0.15, 0.06, 8, 24); color = 0xfbbf24; break;
      case 'gem': geo = new THREE.OctahedronGeometry(0.18); color = 0xec4899; break;
      case 'seal': geo = new THREE.BoxGeometry(0.22, 0.22, 0.22); color = 0xef4444; break;
      case 'sword': geo = new THREE.ConeGeometry(0.1, 0.35, 4); color = 0x60a5fa; break;
      default: geo = new THREE.IcosahedronGeometry(0.16); color = 0x8b5cf6;
    }
    var mat = new THREE.MeshStandardMaterial({
      color: color, metalness: 0.6, roughness: 0.2,
      emissive: color, emissiveIntensity: 0.4
    });
    var mesh = new THREE.Mesh(geo, mat);
    // 随机位置
    mesh.position.set(
      cx + (Math.random() - 0.5) * rangeX * 2,
      cy + (Math.random() - 0.2) * rangeY * 2,
      cz + (Math.random() - 0.5) * rangeZ * 2
    );
    // 光效光晕
    var light = new THREE.PointLight(color, 0.8, 2);
    mesh.add(light);
    poiGroup.add(mesh);

    artifacts.push({
      id: a.id, name: a.name, mesh: mesh,
      baseY: mesh.position.y, phase: Math.random() * Math.PI * 2,
      found: false, trigger: a.trigger || null
    });

    // UI 条目
    var emojiMap = { scroll: '📜', gem: '💎', seal: '🔴', sword: '⚔️', hidden: '🎭' };
    var div = document.createElement('div');
    div.className = 'artifact';
    div.title = a.name;
    div.dataset.id = a.id;
    div.textContent = emojiMap[a.type] || '✨';
    huntList.appendChild(div);
  });
}

/* ============ 摄像头 + Three.js 初始化 ============ */
async function start() {
  try {
    // 摄像头（环境摄像头）
    var video = document.getElementById('arVideo');
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      await video.play();
      document.getElementById('dotCam').style.background = '#22c55e';
    } catch(camErr) {
      console.warn('摄像头启动失败（降级预览模式）:', camErr.message);
      document.getElementById('arLoading').style.display = 'none';
      document.getElementById('arNoCam').style.display = 'flex';
      // 降级：灰色背景当"3D 预览"
      document.getElementById('arVideo').style.background = 'linear-gradient(135deg,#1e293b,#334155)';
    }

    document.getElementById('loadSub').textContent = '初始化 3D 空间';

    // Three.js
    renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('arCanvas'),
      alpha: true, antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 1.2, 4.5);
    camera.lookAt(0, 1, 0);

    scene = new THREE.Scene();

    // 灯光
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    var sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(5, 8, 5);
    scene.add(sun);
    var fill = new THREE.DirectionalLight(0xa5b4fc, 0.3);
    fill.position.set(-3, 2, -5);
    scene.add(fill);

    // 景点模型
    poiGroup = buildPOIModel(POI);
    scene.add(poiGroup);

    // 寻宝线索
    spawnArtifacts(POI);

    // TouchControls
    controls = new TouchControls(renderer.domElement, camera, poiGroup);

    // 窗口大小
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 标题
    document.title = POI.name + ' · AR 空间';
    document.getElementById('titleText').textContent = POI.name + ' · AR 空间';

    // 隐藏加载
    document.getElementById('arLoading').style.display = 'none';

    // 开始故事
    setTimeout(function(){ playStory(POI.plot || []); }, 1200);

    // 彩蛋
    if (POI.easterPlot) {
      document.getElementById('tabEgg').addEventListener('click', function(){
        if (this.classList.contains('locked')) return;
        currentTab = 'egg';
        document.getElementById('tabMain').classList.remove('active');
        this.classList.add('active');
        playStory(POI.easterPlot);
      });
      document.getElementById('tabMain').addEventListener('click', function(){
        currentTab = 'main';
        this.classList.add('active');
        document.getElementById('tabEgg').classList.remove('active');
        playStory(POI.plot || []);
      });
    } else {
      document.getElementById('tabEgg').style.display = 'none';
    }

    // 按钮
    document.getElementById('btnReset').addEventListener('click', function(){
      poiGroup.position.set(0, 0, 0);
      poiGroup.rotation.set(0, 0, 0);
      poiGroup.scale.setScalar(1);
    });
    document.getElementById('btnMic').addEventListener('click', function(){
      voiceOn = !voiceOn;
      this.textContent = voiceOn ? '🔊' : '🔇';
      if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    });
    document.getElementById('btnStory').addEventListener('click', function(){
      playStory(currentTab === 'main' ? (POI.plot || []) : (POI.easterPlot || []));
    });

    // 动画
    animate();

  } catch(e) {
    console.error(e);
    document.getElementById('loadSub').textContent = '初始化失败: ' + e.message;
    document.getElementById('arLoading').querySelector('.spinner').style.borderTopColor = '#ef4444';
  }
}

/* ============ 故事播放 ============ */
function playStory(lines) {
  if (!lines || !lines.length) return;
  var bubble = document.getElementById('arBubble');
  var av = document.getElementById('bAv');
  var name = document.getElementById('bName');
  var text = document.getElementById('bText');
  var pb = document.getElementById('bPb');

  window.clearTimeout(storyTimer);
  var i = 0;
  function next() {
    if (i >= lines.length) {
      bubble.classList.remove('visible');
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      return;
    }
    var ln = lines[i];
    av.textContent = ln.avatar || '👤';
    name.textContent = ln.speaker || '旁白';
    text.textContent = ln.text;
    pb.style.width = '0';
    bubble.classList.add('visible');

    // 语音
    if (voiceOn && window.speechSynthesis) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(ln.text);
        u.lang = 'zh-CN';
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
      } catch(e) {}
    }

    // 彩蛋触发
    if (ln.hint === 'egg' || ln.trigger === 'found_all') {
      if (POI.easterPlot && !document.getElementById('tabEgg').classList.contains('locked')) {
        // 已解锁过，不再弹窗
      } else {
        document.getElementById('eggDesc').textContent = POI.easterIntro || POI.name + ' 里还藏着一个秘密...';
        document.getElementById('modalEgg').classList.add('visible');
      }
    }

    // 动画故事进度条
    var dur = ln.duration || 4000;
    var t0 = Date.now();
    (function step(){
      var pct = Math.min(100, (Date.now() - t0) / dur * 100);
      pb.style.width = pct + '%';
      if (pct < 100) storyTimer = window.setTimeout(step, 50);
    })();

    storyTimer = window.setTimeout(function(){ i++; next(); }, dur);
  }
  next();
}

/* ============ Toast ============ */
var _toastT;
function toast(msg) {
  var t = document.getElementById('arToast');
  t.textContent = msg;
  t.classList.add('visible');
  window.clearTimeout(_toastT);
  _toastT = window.setTimeout(function(){ t.classList.remove('visible'); }, 2200);
}

/* ============ 寻宝 proximity check（每帧） ============ */
function checkProximity() {
  artifacts.forEach(function(a) {
    if (a.found) return;
    var dist = camera.position.distanceTo(a.mesh.position);
    if (dist < 1.8) {
      a.found = true;
      huntState.found.add(a.id);
      // 标记到 UI
      var el = document.querySelector('#huntList .artifact[data-id="' + a.id + '"]');
      if (el) el.classList.add('found');
      toast('✨ 发现线索：' + a.name);
      // 隐藏（或缩小）
      a.mesh.visible = false;

      // 彩蛋触发检查
      if (a.trigger && a.trigger.indexOf('found_artifact_') === 0) {
        var targetN = parseInt(a.trigger.split('_').pop());
        if (huntState.found.size >= targetN) {
          document.getElementById('modalEgg').classList.add('visible');
        }
      }

      // 全部找到
      if (huntState.found.size === huntState.total) {
        huntComplete();
      }
    }
  });
  document.getElementById('huntFound').textContent = huntState.found.size;
}

/* ============ 寻宝完成 ============ */
function huntComplete() {
  toast('🎉 全部线索找到！');
  // 发印记
  try {
    if (window.HuntStorage) window.HuntStorage.addStamp(POI.id);
    else if (window.HuntGame && window.HuntGame.storage) window.HuntGame.storage.addStamp(POI.id);
  } catch(e) {}
  // 弹窗
  var stampEmoji = '🏛️';
  if (POI.id === 'bingmayong') stampEmoji = '⚔️';
  else if (POI.id === 'gugong') stampEmoji = '🐉';
  else if (POI.id === 'xihu') stampEmoji = '🪷';
  else if (POI.id === 'yulong') stampEmoji = '🏔️';
  else if (POI.id === 'potala') stampEmoji = '🛕';
  document.getElementById('stampIcon').textContent = stampEmoji;
  document.getElementById('stampTitle').textContent = POI.name + ' · 拾迹印记已解锁！';
  document.getElementById('stampDesc').textContent = '集齐了 ' + huntState.total + ' 件线索，获得「' + POI.stampName + '」印记';
  setTimeout(function(){
    document.getElementById('modalStamp').classList.add('visible');
  }, 800);
}

/* ============ 动画循环 ============ */
function animate() {
  requestAnimationFrame(animate);

  // 线索漂浮动画
  artifacts.forEach(function(a) {
    if (!a.found) {
      a.mesh.rotation.y += 0.02;
      a.mesh.position.y = a.baseY + Math.sin(Date.now() / 600 + a.phase) * 0.08;
    }
  });

  controls.update();
  checkProximity();
  renderer.render(scene, camera);
}

/* ============ 启动 ============ */
start();
</script>
