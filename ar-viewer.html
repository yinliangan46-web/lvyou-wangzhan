<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;color:#fff}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#topBar{position:fixed;top:0;left:0;right:0;z-index:10;padding:max(14px,env(safe-area-inset-top)) 16px 14px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#topBar>*{pointer-events:auto}
.poi-title{font-weight:700;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.poi-sub{font-size:12px;color:#fbbf24;margin-top:2px}
.top-btns{display:flex;gap:8px}
.top-btns button{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:7px 13px;font-size:13px;transition:.2s}
.top-btns button:active{transform:scale(.95)}
.hotspot-tag{position:absolute;z-index:5;width:38px;height:38px;margin:-19px 0 0 -19px;display:flex;align-items:center;justify-content:center;font-size:18px;background:radial-gradient(circle at 30% 30%,#fde68a,#d97706 70%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 20px rgba(251,191,36,.6),0 4px 12px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s;animation:pulse-hs 2s infinite;pointer-events:auto}
.hotspot-tag:active{transform:scale(1.2)}
.hotspot-tag.visited{background:radial-gradient(circle at 30% 30%,#86efac,#16a34a 70%);box-shadow:0 0 15px rgba(34,197,94,.5);animation:none}
@keyframes pulse-hs{0%,100%{box-shadow:0 0 15px rgba(251,191,36,.5)}50%{box-shadow:0 0 30px rgba(251,191,36,.9)}}
#infoCard{position:fixed;left:16px;right:16px;bottom:20px;z-index:15;background:rgba(15,23,42,.95);backdrop-filter:blur(16px);border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:18px;max-width:500px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#infoCard.visible{transform:translateY(0)}
#infoCard .card-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);color:#94a3b8;font-size:14px;display:flex;align-items:center;justify-content:center}
#infoCard .card-title{font-size:17px;font-weight:700;color:#fbbf24;margin-bottom:10px;padding-right:30px}
#infoCard .card-text{font-size:14px;line-height:1.8;color:#e2e8f0}
#infoCard .card-tag{display:inline-block;margin-top:12px;padding:4px 10px;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);border-radius:10px;font-size:11px;color:#fbbf24}
#gameEntry{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:12;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:30px;padding:14px 28px;font-size:15px;font-weight:700;box-shadow:0 8px 30px rgba(245,158,11,.4);transition:.2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
#gameEntry:active{transform:translateX(-50%) scale(.96)}
#hsCounter{position:fixed;top:max(60px,env(safe-area-inset-top) + 50px);right:16px;z-index:10;background:rgba(15,23,42,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:8px 14px;font-size:12px;color:#94a3b8}
#hsCounter b{color:#fbbf24;font-size:14px}
#storyBubble{position:fixed;left:16px;right:16px;bottom:20px;z-index:14;background:rgba(15,23,42,.92);backdrop-filter:blur(14px);border:1px solid rgba(99,102,241,.3);border-radius:16px;padding:16px 18px;max-width:500px;margin:0 auto;box-shadow:0 10px 40px rgba(99,102,241,.2);opacity:0;transform:translateY(20px);transition:opacity .35s,transform .35s;pointer-events:none}
#storyBubble.visible{opacity:1;transform:translateY(0);pointer-events:auto}
#storyBubble .speaker{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#storyBubble .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px}
#storyBubble .name{font-weight:600;font-size:14px;color:#a5b4fc}
#storyBubble .text{font-size:15px;line-height:1.7;color:#e2e8f0}

#gamePanel{position:fixed;left:16px;right:16px;bottom:20px;z-index:20;background:rgba(15,23,42,.97);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:18px;max-width:500px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#gamePanel.visible{transform:translateY(0)}
#gamePanel .game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#gamePanel .game-title{font-weight:700;font-size:16px;color:#fbbf24}

#gamePanel .game-instruction{font-size:13px;color:#94a3b8;line-height:1.6;margin-bottom:14px}

.game-progress>div{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);width:0;transition:width .3s}
.sort-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.sort-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:12px;font-size:15px;transition:.2s}
.sort-item .emoji{font-size:22px}.sort-item .name{flex:1;font-weight:600}
.sort-item.correct{border-color:#22c55e;background:rgba(34,197,94,.15)}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.place-grid{display:grid;gap:6px;margin-bottom:12px}
.place-row-label{font-size:11px;color:#64748b;margin-bottom:2px}
.place-cell{height:44px;border:2px dashed rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;transition:.2s}
.place-cell.filled{border-style:solid;border-color:#fbbf24;background:rgba(251,191,36,.1)}

.story-scene{font-size:14px;color:#e2e8f0;line-height:1.7;margin-bottom:16px;padding:12px;background:rgba(99,102,241,.1);border-radius:10px;border-left:3px solid #6366f1}
.story-choices{display:flex;flex-direction:column;gap:8px}
.story-choice{padding:12px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:14px;color:#e2e8f0;text-align:left;line-height:1.5}
.story-ending{text-align:center;padding:20px 0}

.story-ending .ending-text{font-size:14px;color:#94a3b8;line-height:1.7}
.quiz-step{text-align:center;margin-bottom:12px}

.quiz-question{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.5}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-option{padding:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:13px;color:#e2e8f0;text-align:center}
.quiz-option.correct{background:rgba(34,197,94,.2);border-color:#22c55e}
.quiz-option.wrong{background:rgba(239,68,68,.2);border-color:#ef4444}
.quiz-hint{margin-top:10px;font-size:12px;color:#64748b;text-align:center}
.match-container{display:flex;justify-content:space-between;gap:16px}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px}
.match-item{padding:12px;text-align:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:10px;font-size:20px}
.match-item.active{border-color:#fbbf24;background:rgba(251,191,36,.15)}
.match-item.matched{border-color:#22c55e;background:rgba(34,197,94,.15);opacity:.6}
.match-item.wrong{border-color:#ef4444;background:rgba(239,68,68,.15);animation:shake .3s}
.rotate-wheel{width:180px;height:180px;margin:0 auto 16px;position:relative}
.rotate-wheel .wheel-bg{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,#c41e3a,#f4a460,#c41e3a,#f4a460,#c41e3a);position:absolute;transition:transform .1s}
.rotate-wheel .wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #fff;z-index:2}
.rotate-wheel .wheel-label{position:absolute;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1}
.rotate-hint{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:14px}
.rotate-btns{display:flex;justify-content:center;gap:12px;margin-bottom:10px}
.rotate-btns button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:22px;color:#fff}
.game-submit{width:100%;margin-top:14px;padding:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:12px;font-size:15px;font-weight:600}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(15,23,42,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:10px 20px;font-size:14px;z-index:40;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(8px)}
.modal-bg.visible{opacity:1;pointer-events:auto}
.modal{background:linear-gradient(160deg,#1e1b4b,#0f172a);border:1px solid rgba(99,102,241,.4);border-radius:20px;padding:28px;text-align:center;max-width:360px;width:100%;box-shadow:0 30px 80px rgba(99,102,241,.3);transform:scale(.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.modal-bg.visible .modal{transform:scale(1)}
.modal h2{font-size:20px;margin-bottom:8px;background:linear-gradient(90deg,#a5b4fc,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal p{color:#a5b4fc;font-size:14px;margin-bottom:16px;line-height:1.6}
.modal .stamp{font-size:72px;margin:10px 0 6px;filter:drop-shadow(0 4px 20px rgba(251,191,36,.4))}
.modal button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:12px;padding:12px 32px;font-size:15px;font-weight:600}
.modal .hint{font-size:12px;color:#64748b;margin-top:10px}
#loading{position:fixed;inset:0;z-index:30;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading .spinner{width:48px;height:48px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .text{font-size:14px;color:#94a3b8}
@media (min-width:768px){#storyBubble,#infoCard,#gamePanel{max-width:500px}}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const POI_ID = params.get('poi') || 'gugong';
const POI = (window.AR_POIS && window.AR_POIS.find(p => p.id === POI_ID)) ||
           (window.AR_POIS && window.AR_POIS[0]);

const HuntStorage = {
  LS: 'myl_hunt_stamps_v3',
  get() { try { return JSON.parse(localStorage.getItem(this.LS) || '[]'); } catch(e) { return []; } },
  add(id) { const a = this.get(); if (!a.includes(id)) { a.push(id); localStorage.setItem(this.LS, JSON.stringify(a)); } }
};

let scene, camera, renderer, controls, composer;
let poiGroup;
let hotspotObjects = [];
const visitedHotspots = new Set();
let autoRotate = true;
const gameState = { active: false, completed: false };

function makeTex(drawFn, rx=2, ry=2) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d'); drawFn(ctx, 256);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = 8;
  return t;
}
function brickTex(base, line) {
  return makeTex((ctx, s) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = line || 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
    const bh = 32, bw = 64;
    for (let y = 0; y < s; y += bh) {
      const off = ((y/bh)%2===0) ? 0 : bw/2;
      for (let x = -bw; x < s+bw; x += bw) ctx.strokeRect(x+off, y, bw, bh);
    }
    for (let i = 0; i < 200; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.06})`;
      ctx.fillRect(Math.random()*s, Math.random()*s, 3, 3);
    }
  }, 4, 2);
}
function roofTileTex() {
  return makeTex((ctx, s) => {
    for (let x = 0; x < s; x += 16) {
      const g = ctx.createLinearGradient(x, 0, x+16, 0);
      g.addColorStop(0, '#9a7a15'); g.addColorStop(0.5, '#e6c24a'); g.addColorStop(1, '#9a7a15');
      ctx.fillStyle = g; ctx.fillRect(x, 0, 16, s);
    }
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    for (let y = 0; y < s; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(s,y); ctx.stroke(); }
  }, 6, 3);
}
function stoneTex() {
  return makeTex((ctx, s) => {
    ctx.fillStyle = '#d0ccc4'; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 300; i++) {
      const v = 180 + Math.random()*40;
      ctx.fillStyle = `rgba(${v},${v},${v},.3)`;
      ctx.fillRect(Math.random()*s, Math.random()*s, 4, 4);
    }
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    for (let y = 0; y < s; y += 64) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(s,y); ctx.stroke(); }
  }, 2, 2);
}
function woodTex(base) {
  return makeTex((ctx, s) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 50; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${Math.random()*0.1})`;
      ctx.beginPath();
      ctx.moveTo(0, Math.random()*s);
      ctx.bezierCurveTo(s/3, Math.random()*s, s*2/3, Math.random()*s, s, Math.random()*s);
      ctx.stroke();
    }
  }, 2, 1);
}

const MATS = {};
function initMats() {
  MATS.redWall = new THREE.MeshStandardMaterial({ map: brickTex('#9a1a1a','rgba(0,0,0,.2)'), roughness: .6, metalness: .1 });
  MATS.goldRoof = new THREE.MeshStandardMaterial({ map: roofTileTex(), roughness: .25, metalness: .8, envMapIntensity: 1.2 });
  MATS.whiteStone = new THREE.MeshStandardMaterial({ map: stoneTex(), roughness: .5, metalness: .05 });
  MATS.darkStone = new THREE.MeshStandardMaterial({ color: 0x8a8680, roughness: .8 });
  MATS.redPillar = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: .35, metalness: .15 });
  MATS.goldDoor = new THREE.MeshStandardMaterial({ color: 0xd4a843, roughness: .3, metalness: .7, envMapIntensity: 1.5 });
  MATS.clay = new THREE.MeshStandardMaterial({ color: 0xa08060, roughness: .85 });
  MATS.clayDark = new THREE.MeshStandardMaterial({ color: 0x8a6f50, roughness: .9 });
  MATS.water = new THREE.MeshStandardMaterial({ color: 0x2a6fa8, roughness: .1, metalness: .6, transparent: true, opacity: .8, envMapIntensity: 1.5 });
  MATS.grass = new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: .9 });
  MATS.rock = new THREE.MeshStandardMaterial({ color: 0x5a6578, roughness: .95 });
  MATS.snow = new THREE.MeshStandardMaterial({ color: 0xf5f8fc, roughness: .3, metalness: .05 });
  MATS.potalaWhite = new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: .45 });
  MATS.potalaRed = new THREE.MeshStandardMaterial({ color: 0x8a1a1a, roughness: .5 });
  MATS.gold = new THREE.MeshStandardMaterial({ color: 0xd4a843, roughness: .15, metalness: .95, envMapIntensity: 2 });
  MATS.darkWood = new THREE.MeshStandardMaterial({ map: woodTex('#6b4423'), roughness: .7 });
}

function buildPOIModel(poi) {
  const g = new THREE.Group();
  initMats();
  switch(poi.id) {
    case 'gugong': g.add(buildGugong()); break;
    case 'bingmayong': g.add(buildBingmayong()); break;
    case 'xihu': g.add(buildXihu()); break;
    case 'zhongshan': g.add(buildZhongshan()); break;
    case 'yulong': g.add(buildYulong()); break;
    case 'potala': g.add(buildPotala()); break;
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(g);
  g.position.x = -(box.min.x + box.max.x) / 2;
  g.position.z = -(box.min.z + box.max.z) / 2;
  g.position.y = -box.min.y;
  return g;
}

function createHotspots(poi) {
  hotspotObjects = [];
  const hotspots = poi.hotspots || [];
  document.getElementById('hsTotal').textContent = hotspots.length;
  const labelsDiv = document.getElementById('labels');
  hotspots.forEach(hs => {
    const anchor = new THREE.Object3D();
    anchor.position.set(hs.position[0], hs.position[1], hs.position[2]);
    poiGroup.add(anchor);
    const tag = document.createElement('div');
    tag.className = 'hotspot-tag';
    tag.textContent = '📌';
    tag.dataset.hsId = hs.id;
    tag.onclick = () => showInfoCard(hs);
    labelsDiv.appendChild(tag);
    hotspotObjects.push({ anchor, tag, data: hs });
  });
}
function updateHotspotPositions() {
  const w = window.innerWidth, h = window.innerHeight;
  hotspotObjects.forEach(hs => {
    const worldPos = new THREE.Vector3();
    hs.anchor.getWorldPosition(worldPos);
    const projected = worldPos.project(camera);
    const x = (projected.x * .5 + .5) * w;
    const y = (-projected.y * .5 + .5) * h;
    if (projected.z > 1) { hs.tag.style.display = 'none'; }
    else {
      hs.tag.style.display = 'flex';
      hs.tag.style.left = x + 'px';
      hs.tag.style.top = y + 'px';
    }
  });
}
function showInfoCard(hs) {
  visitedHotspots.add(hs.id);
  document.getElementById('hsSeen').textContent = visitedHotspots.size;
  const tag = document.querySelector(`.hotspot-tag[data-hs-id="${hs.id}"]`);

  const bubble = document.getElementById('storyBubble');

const GameEngine = {
  panel: null, content: null, progressBar: null, type: null, data: null, state: {},
  init() {
    this.panel = document.getElementById('gamePanel');
    this.content = document.getElementById('gameContent');
    this.progressBar = document.getElementById('gameProgressBar');
    document.getElementById('gameEntry').addEventListener('click', () => this.open());
  },
  open() {
    if (!POI.game) { toast('这个景点还没有游戏'); return; }
    this.type = POI.game.type;
    this.data = POI.game;
    this.state = {};
    document.getElementById('gameTitle').textContent = '🎮 ' + this.data.title;
    document.getElementById('gameInstruction').textContent = this.data.instruction;
    this.panel.classList.add('visible');
    document.getElementById('gameEntry').style.display = 'none';
    gameState.active = true;
    const starters = {
      sort_puzzle: this.startSortPuzzle, placement: this.startPlacement,
      story_choice: this.startStoryChoice, quiz_climb: this.startQuizClimb,
      symbol_match: this.startSymbolMatch, rotate_align: this.startRotateAlign
    };
    if (starters[this.type]) starters[this.type].call(this);
  },
  close() {
    this.panel.classList.remove('visible');
    gameState.active = false;
    if (!gameState.completed) document.getElementById('gameEntry').style.display = 'flex';
  },
  setProgress(pct) { this.progressBar.style.width = pct + '%'; },
  complete() {
    gameState.completed = true;
    this.panel.classList.remove('visible');
    document.getElementById('gameEntry').style.display = 'none';
    toast('🎉 挑战完成！');
    if (POI.stamp) HuntStorage.add(POI.stamp.id);
    setTimeout(() => {
      document.getElementById('stampIcon').textContent = POI.stamp.icon;
      document.getElementById('stampTitle').textContent = POI.name + ' · 印记解锁！';
      document.getElementById('stampDesc').textContent = POI.stamp.desc;
      document.getElementById('modalStamp').classList.add('visible');
    }, 800);
    if (POI.easterEgg && POI.easterEgg.trigger === 'game_complete') {
      setTimeout(() => {
        document.getElementById('eggDesc').textContent = POI.easterEgg.name + ' — ' + (POI.easterEgg.reward ? POI.easterEgg.reward.desc : '');
        document.getElementById('modalEgg').classList.add('visible');
      }, 2500);
    }
  },
  startSortPuzzle() {
    const items = this.data.items.slice();
    for (let i = items.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    let html = '<div class="sort-list">';
    items.forEach((item, idx) => {
      html += `<div class="sort-item" data-id="${item.id}"><span style="color:#475569">⠿</span><span class="emoji">${item.emoji}</span><span class="name">${item.name}</span><button style="background:rgba(255,255,255,.1);color:#fff;padding:4px 8px;border-radius:6px;font-size:12px" onclick="GameEngine.moveItem(${idx},-1)">↑</button><button style="background:rgba(255,255,255,.1);color:#fff;padding:4px 8px;border-radius:6px;font-size:12px" onclick="GameEngine.moveItem(${idx},1)">↓</button></div>`;
    });
    html += '</div><button class="game-submit" onclick="GameEngine.checkSort()">确认排序</button>';
    this.content.innerHTML = html;
    this.setProgress(0);
  },
  moveItem(idx, dir) {
    const items = this.content.querySelectorAll('.sort-item');
    const target = idx + dir;
    if (target < 0 || target >= items.length) return;
    if (dir > 0) items[idx].parentNode.insertBefore(items[idx+1], items[idx]);
    else items[idx].parentNode.insertBefore(items[idx], items[idx-1]);
  },
  checkSort() {
    const correct = this.data.correctOrder;
    let correctCount = 0;
    const items = this.content.querySelectorAll('.sort-item');
    items.forEach((el, i) => {
      el.classList.remove('correct','wrong');
      if (correct[i] === el.dataset.id) { el.classList.add('correct'); correctCount++; }
      else el.classList.add('wrong');
    });
    this.setProgress(Math.round(correctCount / correct.length * 100));
    if (correctCount === correct.length) setTimeout(() => this.complete(), 800);
    else toast(`排对了 ${correctCount}/${correct.length}，继续调整`);
  },
  startPlacement() {
    const grid = this.data.grid, pieces = this.data.pieces.slice();
    let html = '<div class="place-grid">';
    for (let r = 0; r < grid.rows; r++) {
      html += `<div class="place-row-label">${grid.rowLabels[r]}</div><div style="display:grid;grid-template-columns:repeat(${grid.cols},1fr);gap:6px">`;
      for (let c = 0; c < grid.cols; c++) html += `<div class="place-cell" data-row="${r}" data-col="${c}"></div>`;
      html += '</div>';
    }
    html += '</div><div style="font-size:12px;color:#64748b;margin-bottom:6px">点击俑 → 点击位置：</div><div class="place-pool">';
    pieces.forEach(p => { html += `<div class="place-piece" data-id="${p.id}" data-row="${p.row}">${p.emoji}</div>`; });
    html += '</div><button class="game-submit" onclick="GameEngine.checkPlacement()">确认军阵</button>';
    this.content.innerHTML = html;
    this.setProgress(0);
    const self = this; let selectedPiece = null;
    this.content.querySelectorAll('.place-piece').forEach(piece => {
      piece.addEventListener('click', function() {
        self.content.querySelectorAll('.place-piece').forEach(p => p.style.borderColor = '');
        this.style.borderColor = '#fbbf24'; selectedPiece = this;
      });
    });
    this.content.querySelectorAll('.place-cell').forEach(cell => {
      cell.addEventListener('click', function() {
        if (!selectedPiece) { toast('先选一个俑'); return; }
        if (this.classList.contains('filled')) { toast('这里已经有俑了'); return; }
        this.textContent = selectedPiece.textContent;
        this.classList.add('filled');
        this.dataset.correctRow = selectedPiece.dataset.row;
        selectedPiece.style.display = 'none';
        selectedPiece = null;
        self.content.querySelectorAll('.place-piece').forEach(p => p.style.borderColor = '');
      });
    });
  },
  checkPlacement() {
    const self = this; let correctCount = 0;
    const total = this.data.pieces.length;
    this.content.querySelectorAll('.place-cell.filled').forEach(cell => {
      cell.classList.remove('correct','wrong');
      if (parseInt(cell.dataset.row) === parseInt(cell.dataset.correctRow)) { cell.classList.add('correct'); correctCount++; }
      else cell.classList.add('wrong');
    });
    this.setProgress(Math.round(correctCount / total * 100));
    if (correctCount === total) setTimeout(() => self.complete(), 800);
    else toast(`放对了 ${correctCount}/${total}，看看哪排错了`);
  },
  startStoryChoice() { this.state.chapterIdx = 0; this.state.choices = []; this.showChapter(); },
  showChapter() {
    const chapters = this.data.chapters, idx = this.state.chapterIdx;
    if (idx >= chapters.length) { this.showEnding(); return; }
    const ch = chapters[idx];
    this.setProgress(Math.round(idx / chapters.length * 100));
    let html = `<div class="story-scene"><b>【${ch.scene}】</b><br/>${ch.text}</div><div class="story-choices">`;
    ch.choices.forEach(choice => { html += `<button class="story-choice" data-next="${choice.next}">${choice.text}</button>`; });
    html += '</div>';
    this.content.innerHTML = html;
    const self = this;
    this.content.querySelectorAll('.story-choice').forEach(btn => {
      btn.addEventListener('click', function() {
        self.state.choices.push(this.dataset.next);
        self.state.chapterIdx++;
        const next = this.dataset.next;
        if (next.indexOf('ending') >= 0 || next.indexOf('bad') >= 0 || next.indexOf('mid') >= 0) self.showEnding(next);
        else self.showChapter();
      });
    });
  },
  showEnding() {
    const endings = this.data.endings;
    let ending = endings.good_ending;
    const lastChoice = this.state.choices[this.state.choices.length - 1];
    if (lastChoice === 'good_ending') ending = endings.good_ending;
    else if (lastChoice === 'mid_ending') ending = endings.mid_ending;
    else if (lastChoice === 'bad_ending') ending = endings.bad_ending;
    this.setProgress(100);
    this.content.innerHTML = `<div class="story-ending"><div class="ending-title">${ending.title}</div><div class="ending-text">${ending.text}</div></div>`;
    setTimeout(() => this.complete(), 2500);
  },
  startQuizClimb() { this.state.currentStep = 0; this.state.correct = 0; this.showQuestion(); },
  showQuestion() {
    const questions = this.data.questions, idx = this.state.currentStep;
    if (idx >= questions.length) { this.complete(); return; }
    const q = questions[idx];
    this.setProgress(Math.round(idx / questions.length * 100));
    let html = `<div class="quiz-step"><div class="step-num">${idx+1}</div><div class="step-label">第 ${q.step} 级台阶</div></div>`;
    html += `<div class="quiz-question">${q.q}</div><div class="quiz-options">`;
    q.options.forEach((opt, i) => { html += `<button class="quiz-option" data-answer="${i}">${opt}</button>`; });
    html += `</div><div class="quiz-hint" style="display:none">💡 ${q.hint}</div>`;
    this.content.innerHTML = html;
    const self = this;
    this.content.querySelectorAll('.quiz-option').forEach(btn => {
      btn.addEventListener('click', function() {
        const chosen = parseInt(this.dataset.answer), correct = q.answer;
        self.content.querySelectorAll('.quiz-option').forEach((b, i) => {
          if (i === correct) b.classList.add('correct');
          if (i === chosen && chosen !== correct) b.classList.add('wrong');
        });
        self.content.querySelector('.quiz-hint').style.display = 'block';
        if (chosen === correct) { self.state.correct++; toast('✅ 答对了，继续向上！'); }
        else toast('❌ 答错了，看看正确答案');
        setTimeout(() => { self.state.currentStep++; self.showQuestion(); }, 1800);
      });
    });
  },
  startSymbolMatch() {
    const pairs = this.data.pairs.slice();
    this.state.matched = 0; this.state.selectedLeft = null;
    const rightItems = pairs.slice().sort(() => Math.random() - .5);
    let html = '<div class="match-container"><div class="match-col">';
    pairs.forEach(p => { html += `<div class="match-item" data-id="${p.id}" data-side="left">${p.symbol}</div>`; });
    html += '</div><div class="match-col">';
    rightItems.forEach(p => { html += `<div class="match-item" data-id="${p.id}" data-side="right">${p.meaning}</div>`; });
    html += '</div></div>';
    this.content.innerHTML = html;
    this.setProgress(0);
    const self = this;
    this.content.querySelectorAll('[data-side="left"]').forEach(el => {
      el.addEventListener('click', function() {
        self.content.querySelectorAll('[data-side="left"]').forEach(e => e.classList.remove('active'));
        this.classList.add('active'); self.state.selectedLeft = this.dataset.id;
      });
    });
    this.content.querySelectorAll('[data-side="right"]').forEach(el => {
      el.addEventListener('click', function() {
        if (!self.state.selectedLeft) { toast('先选左边的象形文'); return; }
        const rightId = this.dataset.id, leftId = self.state.selectedLeft;
        if (leftId === rightId) {
          this.classList.add('matched');
          self.content.querySelector(`[data-side="left"][data-id="${leftId}"]`).classList.add('matched');
          self.state.matched++;
          self.setProgress(Math.round(self.state.matched / pairs.length * 100));
          toast('✨ 匹配成功！');
          self.state.selectedLeft = null;
          self.content.querySelectorAll('[data-side="left"]').forEach(e => e.classList.remove('active'));
          if (self.state.matched === pairs.length) setTimeout(() => self.complete(), 800);
        } else {
          this.classList.add('wrong');
          const leftEl = self.content.querySelector(`[data-side="left"][data-id="${leftId}"]`);
          if (leftEl) leftEl.classList.add('wrong');
          toast('❌ 不对，再想想');
          const lEl = leftEl; const el = this;
          setTimeout(() => { el.classList.remove('wrong'); if (lEl) lEl.classList.remove('wrong'); }, 600);
        }
      });
    });
  },
  startRotateAlign() { this.state.rotation = 0; this.state.round = 0; this.newRound(); },
  newRound() {
    const totalRounds = this.data.totalRounds;
    if (this.state.round >= totalRounds) { this.complete(); return; }
    this.state.targetRotation = Math.floor(Math.random() * 4) * 90;
    this.state.rotation = 0;
    this.setProgress(Math.round(this.state.round / totalRounds * 100));
    const directions = ['北','东','南','西'];
    let html = `<div class="rotate-hint">第 ${this.state.round+1}/${totalRounds} 轮<br/>目标：让指针对准 <b style="color:#fbbf24">${directions[this.state.targetRotation/90]}</b> 方</div>`;
    html += '<div class="rotate-wheel"><div class="wheel-bg" id="wheelBg"></div><div class="wheel-pointer"></div>';
    const pos = [{top:'5%',left:'50%'},{top:'50%',right:'5%'},{bottom:'5%',left:'50%'},{top:'50%',left:'5%'}];
    const dirs = ['北','东','南','西'];
    for (let i = 0; i < 4; i++) html += `<div class="wheel-label" style="top:${pos[i].top};bottom:${pos[i].bottom||''};left:${pos[i].left};right:${pos[i].right||''}">${dirs[i]}</div>`;
    html += '</div>';
    html += '<div class="rotate-btns"><button onclick="GameEngine.rotateWheel(-30)">↺</button><button onclick="GameEngine.rotateWheel(30)">↻</button></div>';
    html += '<button class="game-submit" onclick="GameEngine.checkRotate()">对齐！</button>';
    this.content.innerHTML = html;
  },
  rotateWheel(deg) {
    this.state.rotation += deg;
    const bg = document.getElementById('wheelBg');
    if (bg) bg.style.transform = `rotate(${this.state.rotation}deg)`;
  },
  checkRotate() {
    const target = this.state.targetRotation;
    const current = ((this.state.rotation % 360) + 360) % 360;
    let diff = Math.abs(current - target);
    if (diff > 180) diff = 360 - diff;
    if (diff <= 15) {
      toast('✨ 对齐成功！佛光降临');
      this.state.round++;
      setTimeout(() => this.newRound(), 800);
    } else toast(`偏差 ${Math.round(diff)}°，再转转`);
  }
};

function init() {
  document.getElementById('poiTitle').textContent = POI.name;
  document.getElementById('poiSub').textContent = POI.subtitle || '';

  const canvas = document.getElementById('scene');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  const camPos = (POI.scene && POI.scene.cameraPos) || [0, 2.5, 6];
  const lookAt = (POI.scene && POI.scene.cameraLookAt) || [0, 1.5, 0];
  camera.position.set(camPos[0], camPos[1], camPos[2]);
  camera.lookAt(lookAt[0], lookAt[1], lookAt[2]);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  scene.fog = new THREE.Fog(0x0a0a0a, 10, 25);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  scene.add(new THREE.AmbientLight(0xffffff, 0.3));
  const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
  sun.position.set(5, 8, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 30;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
  sun.shadow.camera.right = sun.shadow.camera.top = 8;
  sun.shadow.bias = -0.001;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xa5b4fc, 0.4);
  fill.position.set(-3, 3, -5);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffd700, 0.5);
  rim.position.set(0, 5, -8);
  scene.add(rim);

  poiGroup = buildPOIModel(POI);
  scene.add(poiGroup);

  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9, metalness: 0.1 });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 64), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  createHotspots(POI);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 2;
  controls.maxDistance = 15;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.target.set(lookAt[0], lookAt[1], lookAt[2]);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.3, 0.4, 0.85
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  GameEngine.init();
  document.getElementById('btnStory').addEventListener('click', () => playStory(POI.plot || []));
  document.getElementById('btnRotate').addEventListener('click', function() {
    autoRotate = !autoRotate;
    this.style.background = autoRotate ? 'rgba(251,191,36,.3)' : 'rgba(255,255,255,.15)';
  });

  document.getElementById('loading').style.display = 'none';
  setTimeout(() => playStory(POI.plot || []), 600);
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (poiGroup && autoRotate && !gameState.active) poiGroup.rotation.y += 0.003;
  if (controls) controls.update();
  updateHotspotPositions();
  composer.render();
}

init();
</script>
</body>
</html>
