<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>个性推荐 · MYL旅行</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#2563eb;--bg:#f4f7fc;--card:#fff;--text:#1a2433;--muted:#6b7787;--line:#e6ecf5;--soft:#eef3ff;--radius:16px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .container{max-width:920px;margin:0 auto;padding:0 18px}
  header{background:#fff;box-shadow:0 2px 12px rgba(20,50,100,.08);position:sticky;top:0;z-index:20}
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--primary);text-decoration:none}
  .nav-links{display:flex;gap:16px;flex-wrap:wrap}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:14px}
  .nav-links a:hover{color:var(--primary)}
  .hero{padding:30px 0 14px}
  .hero h1{font-size:25px;font-weight:900;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:15px}
  .panel{background:var(--card);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .panel h3{font-size:15px;color:var(--primary);margin-bottom:14px}
  .searchbar{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:16px 0;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .searchbar i{color:var(--muted)}
  .searchbar input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:var(--text)}
  .searchbar .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
  .weight-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .weight-row:last-child{border-bottom:none}
  .weight-row .lbl{width:96px;font-size:14px;font-weight:700;flex-shrink:0}
  .weight-row input[type=range]{flex:1;accent-color:var(--primary)}
  .weight-row .val{width:46px;text-align:right;font-size:13px;color:var(--muted)}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:8px}
  .btn-ghost{background:var(--soft);color:var(--primary)}
  .result{margin:16px 0 30px}
  .rec-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .rec-head{display:flex;gap:16px;cursor:pointer}
  .rec-rank{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--primary);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rec-rank.top{background:var(--primary);color:#fff}
  .rec-body{flex:1}
  .rec-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
  .rec-top h4{font-size:16px}
  .score{font-weight:900;color:var(--primary)}
  .rec-tags{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .rtag{background:#f2f5fa;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .rtag.light{background:#fff4ec;color:#c2620a}
  .rec-reason{font-size:13px;color:var(--muted)}
  .bars{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px}
  .bar{font-size:12px;color:var(--muted)}
  .bar i{display:inline-block;height:6px;border-radius:4px;background:var(--primary);margin-right:5px}
  .rec-detail{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .rec-card.open .rec-detail{display:block}
  .dsec{margin-bottom:12px}
  .dsec h4{font-size:13px;color:var(--primary);margin-bottom:6px}
  .day{margin-bottom:8px}
  .day-t{font-weight:700;font-size:13px;margin-bottom:3px}
  .tl{display:grid;grid-template-columns:58px 1fr;gap:6px;font-size:13px;padding:3px 0}
  .tm{color:var(--muted);font-size:12px}
  .ta{font-weight:500}
  .td{grid-column:2;color:var(--muted);font-size:12px}
  .li{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .li:last-child{border-bottom:none}
  .li .lp{color:var(--muted);font-size:12px}
  .link-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .link-card{border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:3px}
  .link-card b{font-size:13px}
  .link-card span{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .note{font-size:12px;color:#c2620a;background:#fff4ec;border-radius:10px;padding:8px 10px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo"><i class="fas fa-compass"></i><span>MYL</span></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="discover.html">✨ 发现 MYL</a>
      <a href="tools.html">🧰 智能工具</a>
      <a href="recommend.html">个性推荐</a>
    </nav>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>个性权重推荐</h1>
    <p>拖动滑块设置各维度看重程度，按加权模型（AHP 思路）为站内全部城市打分排序；点开卡片可看行程节点、美食、住宿与航班高铁入口。</p>
  </section>

  <div class="searchbar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="搜索城市名、国家或标签，如：六安、海边、古都、美食" />
    <span class="cnt" id="count"></span>
  </div>

  <section class="panel">
    <h3><i class="fas fa-sliders"></i> 我的偏好权重</h3>
    <div id="weights"></div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="runBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成推荐</button>
      <button class="btn btn-ghost" id="resetBtn"><i class="fas fa-rotate-left"></i> 重置权重</button>
    </div>
  </section>

  <section class="result" id="result"></section>
</div>

<script src="city-data.js"></script>
<script src="city-foods.js"></script>
<script src="city-history.js"></script>
<script src="city-landmarks.js"></script>
<script src="city-poi-bank.js"></script>
<script src="province-data-all.js"></script>
<script src="city-index.js"></script>
<script src="city-score-a.js"></script>
<script src="city-score-b.js"></script>
<script src="city-score.js"></script>
<script src="guide-patch.js"></script>
<script>
var DIMS = [
  {k:'food', name:'美食'},
  {k:'sight', name:'景观'},
  {k:'culture', name:'人文'},
  {k:'budget', name:'性价比'},
  {k:'pace', name:'轻松度'},
  {k:'fun', name:'好玩度'}
];
/* 评分统一取自 city-score 分片；缺省城市用中性参考分 */
var DEF = {score:{food:3,sight:3,culture:3,budget:3,pace:3,fun:3}, reason:'综合站内标签与素材给出的参考推荐；具体行程、美食与交通见下方详情。'};
var DEF_LIGHT = {score:{food:3,sight:3,culture:3,budget:3,pace:3,fun:3}, reason:'该城目前为轻量参考，路书整理中；可先看地标、本地美食与历史简介，交通住宿点下方入口查询。'};

var weights = {food:3,sight:3,culture:3,budget:3,pace:3,fun:3};
function $(id){return document.getElementById(id);}
function recOf(c){
  var s = window.MYLSCORE && window.MYLSCORE.get(c.name);
  if (s) return {score:s.r, reason:s.reason};
  return c.tier==='A' ? DEF : DEF_LIGHT;
}

function renderWeights(){
  $('weights').innerHTML = DIMS.map(function(d){
    return '<div class="weight-row"><div class="lbl">'+d.name+'</div>'+
      '<input type="range" min="1" max="5" step="1" data-k="'+d.k+'" value="'+weights[d.k]+'">'+
      '<div class="val" id="v-'+d.k+'">'+weights[d.k]+' 分</div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('input[type=range]'),function(r){
    r.oninput=function(){weights[r.dataset.k]=+r.value;$('v-'+r.dataset.k).textContent=weights[r.dataset.k]+' 分';};
  });
}

function weighted(c){
  var total=0,sum=0;
  DIMS.forEach(function(d){total+=weights[d.k]*recOf(c).score[d.k];sum+=weights[d.k]*5;});
  return Math.round(total/sum*100);
}

function detailBlock(c){
  var isA = c.tier==='A';
  var itinerary=(c.itinerary||[]).map(function(d){
    var tl=(d.timeline||[]).map(function(t){
      var extra=(t.duration?' · '+t.duration:'')+(t.ticket?' · '+t.ticket:'')+(t.tip?'（'+t.tip+'）':'');
      return '<div class="tl"><span class="tm">'+(t.time||'')+'</span><span class="ta">'+(t.activity||'')+'</span><span class="td">'+(t.detail||'')+extra+'</span></div>';
    }).join('');
    return '<div class="day"><div class="day-t">'+(d.day||'')+' · '+(d.theme||'')+'</div>'+tl+'</div>';
  }).join('');

  var foods;
  if(isA){
    foods=(c.foods||[]).map(function(f){
      return '<div class="li">'+f.name+' <span class="lp">'+(f.price||'')+(f.desc?' · '+f.desc:'')+'</span></div>';
    }).join('');
  } else {
    foods=(c.bFoods||[]).map(function(f){return '<div class="li">'+f+'</div>';}).join('');
  }

  var spots = isA ? '' : (c.bLandmarks||[]).map(function(s){return '<div class="li">'+s+'</div>';}).join('');
  var history = (!isA && c.bHistory) ? '<div class="li">'+c.bHistory+'</div>' : '';

  var hotels=(c.hotels||[]).map(function(h){
    return h.bookingUrl
      ? '<a class="link-card" href="'+h.bookingUrl+'" target="_blank" rel="noopener"><b>'+h.name+'</b><span>'+(h.area||'')+' · '+(h.price||'')+'</span><span>'+(h.highlight||'')+'</span></a>'
      : '<div class="link-card"><b>'+h.name+'</b><span>'+(h.area||'')+' · '+(h.price||'')+'</span></div>';
  }).join('');
  var air=(c.airfare||[]).map(function(a){
    return '<a class="link-card" href="'+a.bookingUrl+'" target="_blank" rel="noopener"><b>'+a.platform+'</b><span>'+a.from+' → '+a.to+' · '+a.price+'</span><span>'+(a.time||'')+'</span></a>';
  }).join('');
  var rail=(c.trains||[]).map(function(t){
    return '<a class="link-card" href="'+t.bookingUrl+'" target="_blank" rel="noopener"><b>'+t.platform+'</b><span>'+t.from+' → '+t.to+' · '+t.price+'</span><span>'+(t.duration||'')+' '+(t.time||'')+'</span></a>';
  }).join('');
  var tips=(c.tips||[]).map(function(t){return '<div class="li"><i class="fas fa-circle-info" style="color:var(--primary)"></i> '+t+'</div>';}).join('');

  var generic='';
  if(!isA){
    generic='<div class="note">轻量参考：该城完整路书整理中，下方为通用交通与住宿查询入口。</div>'+
      '<div class="link-grid">'+
        '<a class="link-card" href="https://flights.ctrip.com" target="_blank" rel="noopener"><b>携程机票</b><span>查询往返航班</span></a>'+
        '<a class="link-card" href="https://www.12306.cn" target="_blank" rel="noopener"><b>12306 火车票</b><span>查询高铁/动车</span></a>'+
        '<a class="link-card" href="https://hotels.ctrip.com" target="_blank" rel="noopener"><b>携程酒店</b><span>查询住宿价格</span></a>'+
      '</div>';
  }

  var html='';
  if(!isA && generic) html+='<div class="dsec">'+generic+'</div>';
  if(itinerary) html+='<div class="dsec"><h4><i class="fas fa-route"></i> 行程节点</h4>'+itinerary+'</div>';
  if(spots) html+='<div class="dsec"><h4><i class="fas fa-map-location-dot"></i> 地标景点</h4>'+spots+'</div>';
  if(foods) html+='<div class="dsec"><h4><i class="fas fa-utensils"></i> 美食</h4>'+foods+'</div>';
  if(history) html+='<div class="dsec"><h4><i class="fas fa-landmark"></i> 城市简介</h4>'+history+'</div>';
  if(hotels) html+='<div class="dsec"><h4><i class="fas fa-hotel"></i> 住宿建议</h4><div class="link-grid">'+hotels+'</div></div>';
  if(air) html+='<div class="dsec"><h4><i class="fas fa-plane-departure"></i> 航班入口</h4><div class="link-grid">'+air+'</div></div>';
  if(rail) html+='<div class="dsec"><h4><i class="fas fa-train"></i> 高铁/火车入口</h4><div class="link-grid">'+rail+'</div></div>';
  if(tips) html+='<div class="dsec"><h4><i class="fas fa-lightbulb"></i> 出行贴士</h4>'+tips+'</div>';
  return html;
}

function run(){
  var q=$('searchInput').value.trim();
  var all = window.MYL ? MYL.indexCities() : [];
  var list = q ? MYL.searchCities(q) : all;
  var ranked=list.map(function(c){return {c:c,s:weighted(c)};})
    .sort(function(a,b){
      if(a.c.tier!==b.c.tier) return a.c.tier==='A' ? -1 : 1;
      return b.s-a.s;
    });
  var shown = ranked.slice(0, 30);
  $('count').textContent = '共 ' + list.length + ' 城' + (ranked.length>30?'，显示前 30':'');
  if(!shown.length){$('result').innerHTML='<div class="empty">没有匹配的城市</div>';return;}
  var html=shown.map(function(r,i){
    var rc=recOf(r.c);
    var dims=DIMS.map(function(d){
      return '<div class="bar"><i style="width:'+rc.score[d.k]*10+'px"></i>'+d.name+' '+rc.score[d.k]+'</div>';
    }).join('');
    var tags=(r.c.tags||[]).slice(0,4).map(function(t){return '<span class="rtag">'+t+'</span>';}).join('');
    var lightTag = r.c.tier!=='A' ? '<span class="rtag light">轻量参考</span>' : '';
    return '<div class="rec-card" data-name="'+r.c.name+'">'+
      '<div class="rec-head">'+
        '<div class="rec-rank'+(i<3?' top':'')+'">'+(i+1)+'</div>'+
        '<div class="rec-body">'+
          '<div class="rec-top"><h4>'+r.c.name+'</h4><span class="score">'+r.s+' 分</span></div>'+
          '<div class="rec-tags">'+tags+lightTag+'<span class="rtag">'+(r.c.days||'2–3天')+'</span></div>'+
          '<div class="rec-reason"><i class="fas fa-circle-info" style="color:var(--primary)"></i> '+rc.reason+'</div>'+
          '<div class="bars">'+dims+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="rec-detail">'+detailBlock(r.c)+'</div>'+
    '</div>';
  }).join('');
  $('result').innerHTML = '<h3 style="margin:18px 0 12px">按你的权重排序</h3>'+html;
  Array.prototype.forEach.call(document.querySelectorAll('.rec-head'),function(h){
    h.onclick=function(){h.parentElement.classList.toggle('open');};
  });
}

renderWeights();run();
$('runBtn').onclick=run;
$('resetBtn').onclick=function(){weights={food:3,sight:3,culture:3,budget:3,pace:3,fun:3};renderWeights();run();};
$('searchInput').addEventListener('input',run);
</script>
</body>
</html>
