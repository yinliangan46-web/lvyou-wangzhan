<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>出行日历 · MYL旅行</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#2563eb;--bg:#f4f7fc;--card:#fff;--text:#1a2433;--muted:#6b7787;--line:#e6ecf5;--soft:#eef3ff;--radius:16px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .container{max-width:920px;margin:0 auto;padding:0 18px}
  header{background:#fff;box-shadow:0 2px 12px rgba(20,50,100,.08);position:sticky;top:0;z-index:20}
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--primary);text-decoration:none}
  .nav-links{display:flex;gap:16px;flex-wrap:wrap}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:14px}
  .nav-links a:hover{color:var(--primary)}
  .hero{padding:30px 0 14px}
  .hero h1{font-size:25px;font-weight:900;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
  .m{background:var(--card);border-radius:14px;padding:14px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:.15s;box-shadow:0 4px 14px rgba(20,50,100,.05)}
  .m.active{border-color:var(--primary);background:var(--soft)}
  .m .mn{font-weight:900;font-size:15px}
  .m .mt{font-size:12px;color:var(--muted);margin-top:4px}
  .m .best{font-size:11px;color:var(--primary);margin-top:6px}
  .panel{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .panel h3{font-size:15px;color:var(--primary);margin-bottom:12px}
  .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .chip{background:#f2f5fa;border-radius:8px;padding:4px 11px;font-size:12px;color:var(--muted)}
  .dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .dest{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s;background:#fff}
  .dest.open{border-color:var(--primary);box-shadow:0 6px 20px rgba(37,99,235,.12)}
  .dest-head{padding:14px 16px;cursor:pointer}
  .dest-head .dt{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .dest-head .ds{color:var(--muted);font-size:12px;margin-top:3px}
  .dest-head .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .badge{font-size:11px;border-radius:8px;padding:3px 9px;background:var(--soft);color:var(--primary)}
  .badge.gray{background:#f2f5fa;color:var(--muted)}
  .dest-body{padding:0 16px 16px;display:none}
  .dest.open .dest-body{display:block}
  .dsec{margin-bottom:12px}
  .dsec h4{font-size:13px;color:var(--primary);margin-bottom:6px}
  .day{margin-bottom:8px}
  .day-t{font-weight:700;font-size:13px;margin-bottom:3px}
  .tl{display:grid;grid-template-columns:58px 1fr;gap:6px;font-size:13px;padding:3px 0}
  .tm{color:var(--muted);font-size:12px}
  .ta{font-weight:500}
  .td{grid-column:2;color:var(--muted);font-size:12px}
  .li{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .li:last-child{border-bottom:none}
  .li .lp{color:var(--muted);font-size:12px}
  .link-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .link-card{border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:3px}
  .link-card b{font-size:13px}
  .link-card span{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  @media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo"><i class="fas fa-compass"></i><span>MYL</span></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="discover.html">✨ 发现 MYL</a>
      <a href="tools.html">🧰 智能工具</a>
      <a href="calendar.html">出行日历</a>
    </nav>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>交互出行日历</h1>
    <p>按月份挑目的地：当月气候适宜的城市自动聚合进来，点开可看行程节点、美食、住宿、航班与高铁入口。</p>
  </section>

  <section class="grid" id="grid"></section>
  <section id="detail"></section>
</div>

<script src="city-data.js"></script>
<script src="city-foods.js"></script>
<script src="city-history.js"></script>
<script src="city-landmarks.js"></script>
<script src="city-poi-bank.js"></script>
<script src="province-data-all.js"></script>
<script src="city-index.js"></script>
<script src="city-score-a.js"></script>
<script src="city-score-b.js"></script>
<script src="city-score.js"></script>
<script src="city-augment-1.js"></script>
<script src="city-augment-2.js"></script>
<script src="city-augment-3.js"></script>
<script src="guide-patch.js"></script>
<script>
/* 城市最佳出行月份（按气候与景观适宜度）；命中即归入当月推荐 */
var SEASON = {
  '哈尔滨':[12,1,2],'长春':[12,1,2],'沈阳':[5,9,10],'呼和浩特':[6,7,8,9],'乌鲁木齐':[6,7,8,9],
  '银川':[5,9,10],'西宁':[6,7,8],'兰州':[5,9,10],'拉萨':[5,6,9,10],'敦煌':[5,9,10],
  '九寨沟':[9,10],'黄果树':[7,8],'昆明':[3,4,5,9,10,11],'大理':[3,4,5,9,10,11],'丽江':[3,4,5,9,10,11],
  '西双版纳':[11,12,1,2,3],'三亚':[11,12,1,2,3],'海口':[11,12,1,2,3],'青岛':[6,7,8,9],'厦门':[3,4,5,10,11],
  '桂林':[4,5,9,10],'黄山':[4,5,9,10],'张家界':[4,5,9,10],'西安':[3,4,5,9,10],'北京':[4,5,9,10],
  '济南':[5,9,10],'郑州':[4,5,9,10],'太原':[5,9,10],'石家庄':[5,9,10],'南京':[3,4,5,9,10,11],
  '苏州':[3,4,5,9,10],'上海':[3,4,5,9,10,11],'杭州':[3,4,5,9,10],'合肥':[4,5,9,10],'南昌':[4,5,9,10],
  '福州':[3,4,10,11],'广州':[10,11,12,1,2,3],'深圳':[10,11,12,1,2,3],'武汉':[3,4,5,9,10],'长沙':[3,4,5,9,10,11],
  '重庆':[3,4,5,9,10],'成都':[3,4,5,9,10,11],'贵阳':[6,7,8,9],'乐山':[3,4,5,9,10],'南宁':[10,11,12,3,4],
  '巴黎':[5,6,9],'伦敦':[5,6,7,9],'东京':[3,4,10,11],'迪拜':[11,12,1,2,3],'曼谷':[11,12,1,2,3],
  '巴厘岛':[4,5,6,9,10],'香港':[10,11,12,3,4]
};

var MONTHS = [
  {m:1, label:'1月', tip:'避寒与冰雪季', weather:'北方严寒、南方温和', wear:'羽绒服/保暖层，南方薄外套'},
  {m:2, label:'2月', tip:'春节错峰 · 温泉与古镇', weather:'气温偏低，南方回暖慢', wear:'厚外套，备薄内搭'},
  {m:3, label:'3月', tip:'初春踏青 · 花开季', weather:'由冷转暖，早晚温差大', wear:'洋葱式穿搭，风衣+薄毛衣'},
  {m:4, label:'4月', tip:'气候舒适 · 最佳出行档', weather:'温和少雨，紫外线渐强', wear:'长袖+薄外套，防晒'},
  {m:5, label:'5月', tip:'初夏 · 人少景美', weather:'温暖干燥，临近梅雨', wear:'短袖+轻便外套'},
  {m:6, label:'6月', tip:'初夏避暑 · 梅雨前夕', weather:'南方闷热多雨', wear:'透气衣物，带雨具'},
  {m:7, label:'7月', tip:'盛夏避暑 · 海滨与高原', weather:'高温，北方海滨舒适', wear:'防晒+透气，备解暑药'},
  {m:8, label:'8月', tip:'暑期高峰 · 错峰出行', weather:'高温多雨，局地台风', wear:'轻薄透气，备雨具'},
  {m:9, label:'9月', tip:'秋高气爽 · 性价比高', weather:'转凉舒适，雨水减少', wear:'长袖为主，早晚加外套'},
  {m:10, label:'10月', tip:'金秋 · 景色最佳档', weather:'晴朗凉爽，昼夜温差大', wear:'长袖+薄外套'},
  {m:11, label:'11月', tip:'深秋 · 人少价优', weather:'渐冷，南方温暖', wear:'厚外套，北方备保暖'},
  {m:12, label:'12月', tip:'冬景 · 跨年与玩雪', weather:'北方进入严寒', wear:'羽绒服/保暖装备'}
];

var cur = new Date().getMonth() + 1;
function $(id){return document.getElementById(id);}

function citiesOfMonth(m){
  var all = window.MYL ? MYL.indexCities() : [];
  return all.filter(function(c){
    var months = SEASON[c.name];
    return months && months.indexOf(m) >= 0;
  });
}

function renderGrid(){
  $('grid').innerHTML = MONTHS.map(function(o){
    var n = citiesOfMonth(o.m).length;
    return '<div class="m'+(cur===o.m?' active':'')+'" data-m="'+o.m+'"><div class="mn">'+o.label+'</div><div class="mt">'+o.tip+'</div><div class="best"><i class="fas fa-location-dot"></i> '+n+' 个目的地</div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.m'),function(el){
    el.onclick=function(){cur=+el.dataset.m;renderGrid();renderDetail();};
  });
}

function cleanTheme(t){
  return (t||'').replace(/深度(游玩|游览|体验|游)/g,'当地休闲体验');
}
function detailBlock(c){
  var isA=c.tier==='A';
  var itinerary=(c.itinerary||[]).map(function(d){
    var tl=(d.timeline||[]).map(function(t){
      var extra=(t.duration?' · '+t.duration:'')+(t.ticket?' · '+t.ticket:'')+(t.tip?'（'+t.tip+'）':'');
      return '<div class="tl"><span class="tm">'+(t.time||'')+'</span><span class="ta">'+(t.activity||'')+'</span><span class="td">'+(t.detail||'')+extra+'</span></div>';
    }).join('');
    return '<div class="day"><div class="day-t">'+(d.day||'')+' · '+cleanTheme(d.theme)+'</div>'+tl+'</div>';
  }).join('');
  var foods=isA
    ? (c.foods||[]).map(function(f){
        return '<div class="li">'+f.name+' <span class="lp">'+(f.price||'')+(f.desc?' · '+f.desc:'')+'</span></div>';
      }).join('')
    : (c.bFoods||[]).map(function(f){return '<div class="li">'+f+'</div>';}).join('');
  var spots=(!isA&&c.bLandmarks)?(c.bLandmarks.map(function(x){return '<div class="li">'+x+'</div>';}).join('')):'';
  var history=(!isA&&c.bHistory)?'<div class="li">'+c.bHistory+'</div>':'';
  var hotels=(c.hotels||[]).map(function(h){
    return h.bookingUrl
      ? '<a class="link-card" href="'+h.bookingUrl+'" target="_blank" rel="noopener"><b>'+h.name+'</b><span>'+(h.area||'')+' · '+(h.price||'')+'</span><span>'+(h.highlight||'')+'</span></a>'
      : '<div class="link-card"><b>'+h.name+'</b><span>'+(h.area||'')+' · '+(h.price||'')+'</span></div>';
  }).join('');
  var air=(c.airfare||[]).map(function(a){
    return '<a class="link-card" href="'+a.bookingUrl+'" target="_blank" rel="noopener"><b>'+a.platform+'</b><span>'+a.from+' → '+a.to+' · '+a.price+'</span><span>'+(a.time||'')+'</span></a>';
  }).join('');
  var rail=(c.trains||[]).map(function(t){
    return '<a class="link-card" href="'+t.bookingUrl+'" target="_blank" rel="noopener"><b>'+t.platform+'</b><span>'+t.from+' → '+t.to+' · '+t.price+'</span><span>'+(t.duration||'')+' '+(t.time||'')+'</span></a>';
  }).join('');
  var tips=(c.tips||[]).map(function(t){return '<div class="li"><i class="fas fa-circle-info" style="color:var(--primary)"></i> '+t+'</div>';}).join('');
  var html='';
  if(!isA) html+='<div class="li" style="color:#c2620a">轻量参考：该城完整路书整理中，下方为已有地标、美食与通用交通住宿入口。</div>';
  if(itinerary) html+='<div class="dsec"><h4><i class="fas fa-route"></i> 行程节点</h4>'+itinerary+'</div>';
  if(spots) html+='<div class="dsec"><h4><i class="fas fa-map-location-dot"></i> 地标景点</h4>'+spots+'</div>';
  if(foods) html+='<div class="dsec"><h4><i class="fas fa-utensils"></i> 美食（早/中/晚参考）</h4>'+foods+'</div>';
  if(history) html+='<div class="dsec"><h4><i class="fas fa-landmark"></i> 城市简介</h4>'+history+'</div>';
  if(hotels) html+='<div class="dsec"><h4><i class="fas fa-hotel"></i> 住宿建议</h4><div class="link-grid">'+hotels+'</div></div>';
  if(air) html+='<div class="dsec"><h4><i class="fas fa-plane-departure"></i> 航班入口</h4><div class="link-grid">'+air+'</div></div>';
  if(rail) html+='<div class="dsec"><h4><i class="fas fa-train"></i> 高铁/火车入口</h4><div class="link-grid">'+rail+'</div></div>';
  if(!isA){
    html+='<div class="dsec"><h4><i class="fas fa-link"></i> 通用预订入口</h4><div class="link-grid">'+
      '<a class="link-card" href="https://flights.ctrip.com" target="_blank" rel="noopener"><b>携程机票</b><span>查询往返航班</span></a>'+
      '<a class="link-card" href="https://www.12306.cn" target="_blank" rel="noopener"><b>12306 火车票</b><span>查询高铁/动车</span></a>'+
      '<a class="link-card" href="https://hotels.ctrip.com" target="_blank" rel="noopener"><b>携程酒店</b><span>查询住宿价格</span></a>'+
    '</div></div>';
  }
  if(tips) html+='<div class="dsec"><h4><i class="fas fa-lightbulb"></i> 出行贴士</h4>'+tips+'</div>';
  return html;
}

function renderDetail(){
  var o=MONTHS.find(function(x){return x.m===cur;});
  var list=citiesOfMonth(o.m);
  var cards=list.map(function(c,idx){
    var tags=(c.tags||[]).slice(0,3).map(function(t){return '<span class="badge gray">'+t+'</span>';}).join('');
    var stats=[
      '<span class="badge"><i class="fas fa-route"></i> '+(c.itinerary.length)+' 节点</span>',
      '<span class="badge"><i class="fas fa-utensils"></i> '+(c.tier==='A'?c.foods.length:(c.bFoods||[]).length)+' 美食</span>',
      '<span class="badge"><i class="fas fa-hotel"></i> '+(c.hotels.length)+' 住宿</span>'
    ];
    if(c.airfare.length) stats.push('<span class="badge"><i class="fas fa-plane"></i> 航班</span>');
    if(c.trains.length) stats.push('<span class="badge"><i class="fas fa-train"></i> 高铁</span>');
    return '<div class="dest" data-idx="'+idx+'">'
      +'<div class="dest-head"><div class="dt"><i class="fas fa-map-marker-alt" style="color:var(--primary)"></i>'+c.name+'</div>'
      +'<div class="ds">'+(c.country||'中国')+' · '+(c.days||'2–3天')+'</div>'
      +'<div class="stats">'+stats.join('')+tags+'</div></div>'
      +'<div class="dest-body">'+detailBlock(c)+'</div></div>';
  }).join('');
  $('detail').innerHTML =
    '<div class="panel"><h3><i class="fas fa-cloud-sun"></i> '+o.label+' · 天气与穿搭</h3>'+
      '<div class="meta-row"><span class="chip"><i class="fas fa-temperature-half"></i> '+o.weather+'</span><span class="chip"><i class="fas fa-shirt"></i> '+o.wear+'</span></div></div>'+
    '<div class="panel"><h3><i class="fas fa-route"></i> 当月适宜目的地（'+list.length+'）</h3>'+
      (cards || '<div class="empty">本月暂无收录的最佳目的地，可查看其他月份。</div>')+
    '</div>';
  Array.prototype.forEach.call(document.querySelectorAll('.dest'),function(el){
    el.querySelector('.dest-head').onclick=function(){el.classList.toggle('open');};
  });
}

renderGrid();renderDetail();
</script>
</body>
</html>
