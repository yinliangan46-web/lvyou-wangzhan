<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />

<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo"><i class="fas fa-compass"></i><span>MYL</span></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="discover.html">✨ 发现 MYL</a>
      <a href="compare.html">目的地对比</a>
      <a href="themes.html">主题线路</a>
    </nav>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>行前备忘单</h1>
    <p>选目的地一键生成出发前备忘：预约门票、交通、住宿、美食、必备物品和注意事项，可保存或截图带走，覆盖站内全部城市。</p>
  </section>

  <section class="picker no-print">
    <div class="searchbar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="搜索全部城市，如：六安、成都、厦门" />
    </div>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button class="btn btn-primary" id="genBtn"><i class="fas fa-file-lines"></i> 生成备忘单</button>
      <button class="btn btn-ghost" id="printBtn"><i class="fas fa-print"></i> 打印 / 存 PDF</button>
      <button class="btn btn-ghost" id="copyBtn"><i class="fas fa-copy"></i> 复制文本</button>
    </div>
  </section>

  <div id="sheetBox"></div>
</div>
