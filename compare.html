<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>目的地对比 · MYL旅行</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#2563eb; --primary-dark:#1d4fc4; --bg:#f4f7fc; --card:#fff;
    --text:#1a2433; --muted:#6b7787; --line:#e6ecf5; --soft:#eef3ff;
    --good:#16a34a; --warn:#d97706; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .container{max-width:1120px;margin:0 auto;padding:0 18px}
  header{background:#fff;box-shadow:0 2px 12px rgba(20,50,100,.08);position:sticky;top:0;z-index:20}
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--primary);text-decoration:none}
  .nav-links{display:flex;gap:18px;flex-wrap:wrap}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:14px}
  .nav-links a:hover{color:var(--primary)}
  .hero{padding:34px 0 18px}
  .hero h1{font-size:26px;font-weight:900;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:15px}
  .picker{background:var(--card);border-radius:var(--radius);padding:18px;margin:18px 0;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .picker-title{font-weight:700;margin-bottom:12px;font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer;transition:.15s;color:var(--text)}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .chip .cnt{opacity:.7;font-size:12px;margin-left:4px}
  .basket{margin-top:14px;font-size:13px;color:var(--muted)}
  .basket b{color:var(--primary)}
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;margin:18px 0}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(20,50,100,.06)}
  .card h3{font-size:16px;margin-bottom:14px}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:500;width:130px}
  td.obj{font-weight:700}
  .obj-head{display:flex;flex-direction:column;gap:6px}
  .obj-head img{width:100%;height:70px;object-fit:cover;border-radius:10px}
  .tag{display:inline-block;background:var(--soft);color:var(--primary);border-radius:8px;padding:2px 8px;font-size:12px}
  .bar{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--primary)}
  .score{display:flex;align-items:center;gap:8px}
  .best{color:var(--good);font-weight:700}
  .radar-box{display:flex;flex-direction:column;align-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;justify-content:center}
  .legend span{display:flex;align-items:center;gap:6px;font-size:13px}
  .dot{width:12px;height:12px;border-radius:4px;display:inline-block}
  .conclusion{margin-top:18px}
  .concl-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .concl-item:last-child{border-bottom:none}
  .concl-item i{color:var(--primary);margin-top:3px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty i{font-size:34px;margin-bottom:10px;color:#c7d3e6}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo"><i class="fas fa-compass"></i><span>MYL</span></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="discover.html">✨ 发现 MYL</a>
      <a href="themes.html">主题线路</a>
      <a href="compare.html">目的地对比</a>
    </nav>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>目的地横向对比</h1>
    <p>勾选 2–4 个同类目的地，从成本、强度、体验、适配人群逐项并排比较，直接看哪个更适合你。</p>
  </section>

  <section class="picker">
    <div class="picker-title"><i class="fas fa-list-check"></i> 选择要对比的目的地</div>
    <div class="chips" id="chips"></div>
    <div class="basket" id="basket"></div>
  </section>

  <div id="result"></div>
</div>

<script>
var DESTS = [
  {id:'chengdu', name:'成都', tag:'美食都市', img:'https://images.unsplash.com/photo-1565992441121-4367c29671e2?w=400&q=80',
    price:'¥1,500–2,500', days:'4天', walk:3, drive:'市区为主', photo:3, food:5, culture:3, night:4, value:4, relax:4, scenery:3,
    season:'3–6月 / 9–11月', who:'美食爱好者、休闲度假、亲子', avoid:'追求高强度自然风光', transport:'低（地铁发达）', risk:'夏季闷热，热门店排队'},
  {id:'hangzhou', name:'杭州', tag:'江南人文', img:'https://images.unsplash.com/photo-1528164344705-47542687000d?w=400&q=80',
    price:'¥1,800–2,800', days:'3天', walk:3, drive:'市区为主', photo:4, food:3, culture:4, night:3, value:3, relax:4, scenery:4,
    season:'3–5月 / 9–11月', who:'休闲放松、文化探访、情侣', avoid:'纯美食探店型游客', transport:'低（地铁+公交）', risk:'周末西湖人流集中'},
  {id:'xian', name:'西安', tag:'历史人文', img:'https://images.unsplash.com/photo-1508804185872-d7badad00f7d?w=400&q=80',
    price:'¥1,600–2,600', days:'3–4天', walk:4, drive:'兵马俑需近郊车程', photo:4, food:4, culture:5, night:3, value:4, relax:3, scenery:3,
    season:'3–5月 / 9–11月', who:'历史爱好者、亲子研学', avoid:'怕走路、体力有限', transport:'低（地铁可达城区）', risk:'临潼景点距离远，旺季排队'},
  {id:'xiamen', name:'厦门', tag:'海滨休闲', img:'https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?w=400&q=80',
    price:'¥1,800–2,800', days:'3天', walk:3, drive:'岛内+轮渡', photo:4, food:3, culture:2, night:3, value:3, relax:5, scenery:4,
    season:'3–5月 / 10–11月', who:'情侣、休闲度假、摄影', avoid:'深度文化游需求', transport:'中（含船票）', risk:'鼓浪屿船票需提前买，台风季关注航班'},
  {id:'qingdao', name:'青岛', tag:'海滨城市', img:'https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=400&q=80',
    price:'¥1,700–2,600', days:'3–4天', walk:3, drive:'市区+崂山', photo:4, food:3, culture:2, night:3, value:4, relax:4, scenery:4,
    season:'6–9月', who:'亲子避暑、啤酒美食、海滨度假', avoid:'冬季出行', transport:'中', risk:'暑期房价上浮明显'},
  {id:'dali', name:'大理', tag:'自然慢游', img:'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=400&q=80',
    price:'¥2,000–3,200', days:'4–5天', walk:2, drive:'环海车程为主', photo:5, food:2, culture:3, night:2, value:3, relax:5, scenery:5,
    season:'3–5月 / 9–11月', who:'情侣、慢游放空、摄影出片', avoid:'夜生活、购物需求', transport:'中（建议包车/骑行）', risk:'高原日晒，雨季路况需留意'},
  {id:'haerbin', name:'哈尔滨', tag:'冰雪都市', img:'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&q=80',
    price:'¥2,200–3,500', days:'3–4天', walk:3, drive:'市区为主', photo:5, food:3, culture:3, night:3, value:3, relax:4, scenery:4,
    season:'12–2月', who:'亲子玩雪、冰雪摄影', avoid:'怕冷、冬季不耐寒', transport:'中高', risk:'严寒注意保暖，冰雪大世界票价较高'},
  {id:'sanya', name:'三亚', tag:'海岛度假', img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80',
    price:'¥3,000–5,000', days:'4–5天', walk:1, drive:'酒店-海滩通勤', photo:4, food:2, culture:1, night:3, value:2, relax:5, scenery:4,
    season:'11–次年3月', who:'纯度假、亲子、情侣', avoid:'预算有限、文化探索', transport:'高（多需飞行）', risk:'旺季酒店价格高，夏秋季台风'},
  {id:'changsha', name:'长沙', tag:'美食夜生活', img:'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=400&q=80',
    price:'¥1,400–2,200', days:'2–3天', walk:3, drive:'市区为主', photo:3, food:5, culture:3, night:5, value:5, relax:4, scenery:2,
    season:'3–5月 / 9–11月', who:'美食探店、年轻人、夜生活', avoid:'追求安静休闲', transport:'低（地铁发达）', risk:'网红餐排队时间长'},
  {id:'chongqing', name:'重庆', tag:'山城都市', img:'https://images.unsplash.com/photo-1551504734-5ee491961fcc?w=400&q=80',
    price:'¥1,500–2,400', days:'3–4天', walk:4, drive:'市区爬坡上坎', photo:5, food:5, culture:3, night:4, value:4, relax:2, scenery:4,
    season:'3–5月 / 9–11月', who:'城市摄影、美食、年轻人', avoid:'腿脚不便、怕爬坡', transport:'低（轻轨+地铁）', risk:'地形复杂导航易迷，夏季酷热'}
];

var RADAR = ['scenery','food','value','relax','photo'];
var COLORS = ['#2563eb','#16a34a','#d97706','#7c3aed'];
var selected = [];

function $(id){return document.getElementById(id);}

function renderChips(){
  $('chips').innerHTML = DESTS.map(function(d){
    var on = selected.indexOf(d.id)>=0;
    return '<button class="chip'+(on?' active':'')+'" data-id="'+d.id+'">'+d.name+'<span class="cnt">'+d.tag+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(btn){
    btn.onclick=function(){
      var id=btn.dataset.id, i=selected.indexOf(id);
      if(i>=0){selected.splice(i,1);}
      else{
        if(selected.length>=4){alert('最多对比 4 个目的地');return;}
        selected.push(id);
      }
      renderChips(); renderResult();
    };
  });
  $('basket').innerHTML = selected.length? '已选 <b>'+selected.length+'</b> 个：'+selected.map(function(id){return DESTS.find(function(d){return d.id===id;}).name;}).join('、')+'（可再点取消）' : '还未选择，勾选后这里生成对比表。';
}

function bar(n){return '<div class="score"><div class="bar"><i style="width:'+(n/5*100)+'%"></i></div><span>'+n+'/5</span></div>';}

function renderTable(list){
  var head = '<tr><th>对比维度</th>'+list.map(function(d){
    return '<td class="obj"><div class="obj-head"><img src="'+d.img+'" onerror="this.style.visibility=\'hidden\'"><span>'+d.name+'</span><span class="tag">'+d.tag+'</span></div></td>';
  }).join('')+'</tr>';

  function row(label, fn){
    var cells = list.map(function(d){return '<td>'+fn(d)+'</td>';}).join('');
    return '<tr><th>'+label+'</th>'+cells+'</tr>';
  }
  function bestCell(key, reverse){
    return list.map(function(d){
      var v=d[key]; var max=Math.max.apply(null,list.map(function(x){return x[key];}));
      var min=Math.min.apply(null,list.map(function(x){return x[key];}));
      var cls = (!reverse && v===max)||(reverse && v===min)?'best':'';
      return '<td class="'+cls+'">'+bar(v)+'</td>';
    }).join('');
  }

  var rows = head
    + row('人均参考', function(d){return d.price;})
    + row('建议天数', function(d){return d.days;})
    + row('交通强度', function(d){return d.drive;})
    + '<tr><th>美食密度</th>'+bestCell('food')+'</tr>'
    + '<tr><th>性价比</th>'+bestCell('value')+'</tr>'
    + '<tr><th>轻松度</th>'+bestCell('relax')+'</tr>'
    + '<tr><th>出片度</th>'+bestCell('photo')+'</tr>'
    + '<tr><th>景观风光</th>'+bestCell('scenery')+'</tr>'
    + '<tr><th>文化浓度</th>'+bestCell('culture')+'</tr>'
    + '<tr><th>夜生活</th>'+bestCell('night')+'</tr>'
    + '<tr><th>步行强度</th>'+bestCell('walk', true)+'</tr>'
    + row('最佳季节', function(d){return d.season;})
    + row('适合人群', function(d){return d.who;})
    + row('不太适合', function(d){return d.avoid;})
    + row('交通成本', function(d){return d.transport;})
    + row('避坑提示', function(d){return d.risk;});

  return '<div class="card"><h3><i class="fas fa-table"></i> 对比矩阵</h3><div class="table-wrap"><table>'+rows+'</table></div><div class="note">绿色标注为该维度表现更优项；价格与强度为站内参考口径，出行前请以平台实时信息为准。</div></div>';
}

function radarSVG(list){
  var size=300, cx=size/2, cy=size/2, R=100, n=RADAR.length;
  function pt(i, r){var ang=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];}
  var grid='';
  [1,0.66,0.33].forEach(function(f){
    var pts=[];for(var i=0;i<n;i++){var p=pt(i,R*f);pts.push(p[0]+','+p[1]);}
    grid+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="#e6ecf5"/>';
  });
  var axes='';
  for(var i=0;i<n;i++){var p=pt(i,R);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#e6ecf5"/>';
    var lp=pt(i,R+22);axes+='<text x="'+lp[0]+'" y="'+lp[1]+'" text-anchor="middle" font-size="11" fill="#6b7787">'+RADAR[i]+'</text>';}
  var polys = list.map(function(d,idx){
    var pts=RADAR.map(function(k,i){var p=pt(i,R*d[k]/5);return p[0]+','+p[1];}).join(' ');
    return '<polygon points="'+pts+'" fill="'+COLORS[idx%COLORS.length]+'" fill-opacity="0.15" stroke="'+COLORS[idx%COLORS.length]+'" stroke-width="2"/>';
  }).join('');
  var legend='<div class="legend">'+list.map(function(d,i){
    return '<span><i class="dot" style="background:'+COLORS[i%COLORS.length]+'"></i>'+d.name+'</span>';
  }).join('')+'</div>';
  return '<div class="card radar-box"><h3><i class="fas fa-chart-radar"></i> 五维画像</h3><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+grid+axes+polys+'</svg>'+legend+'</div>';
}

function conclusion(list){
  if(list.length<2) return '';
  var tips=[];
  function top(key){var b=list[0];list.forEach(function(d){if(d[key]>b[key])b=d;});return b;}
  var food=top('food'), relax=top('relax'), value=top('value'), photo=top('photo'), scenery=top('scenery'), culture=top('culture');
  tips.push({i:'fa-utensils', t:'想吃得尽兴，优先选 <b>'+food.name+'</b>（美食密度 '+food.food+'/5）。'});
  tips.push({i:'fa-couch', t:'想轻松度假不赶路，优先选 <b>'+relax.name+'</b>（轻松度 '+relax.relax+'/5）。'});
  tips.push({i:'fa-wallet', t:'看重性价比，优先选 <b>'+value.name+'</b>（性价比 '+value.value+'/5）。'});
  tips.push({i:'fa-camera', t:'想拍照出片，优先选 <b>'+photo.name+'</b>（出片度 '+photo.photo+'/5）。'});
  tips.push({i:'fa-mountain', t:'想看自然风光，优先选 <b>'+scenery.name+'</b>（景观 '+scenery.scenery+'/5）。'});
  tips.push({i:'fa-landmark', t:'想了解历史文化，优先选 <b>'+culture.name+'</b>（文化浓度 '+culture.culture+'/5）。'});
  return '<div class="card conclusion"><h3><i class="fas fa-lightbulb"></i> 对比结论</h3>'+
    tips.map(function(x){return '<div class="concl-item"><i class="fas '+x.i+'"></i><span>'+x.t+'</span></div>';}).join('')+
    '<div class="note">结论由站内标签规则生成，仅供方向参考；最终请结合你的同行人、天数和预算决定。</div></div>';
}

function renderResult(){
  var box=$('result');
  if(!selected.length){box.innerHTML='<div class="card empty"><i class="fas fa-route"></i><div>勾选上方目的地后，这里会出现对比矩阵、五维画像和选择建议。</div></div>';return;}
  var list=selected.map(function(id){return DESTS.find(function(d){return d.id===id;});});
  var layout = list.length<=2 ? '<div class="grid"><div>'+renderTable(list)+'</div>'+radarSVG(list)+'</div>'
    : renderTable(list)+'<div style="margin-top:18px">'+radarSVG(list)+'</div>';
  box.innerHTML = layout + conclusion(list);
}

renderChips(); renderResult();
</script>
</body>
</html>
