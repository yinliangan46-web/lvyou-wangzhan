<div class="container">
  <section class="hero">
    <h1>目的地横向对比</h1>
    <p>搜索全部城市，勾选 2–4 个目的地并排比较；完整城市可看行程节点、美食、住宿、市内交通、航班与高铁入口，轻量城市展示地标、美食与通用预订入口。</p>
  </section>

  <div class="searchbar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="搜索城市名、国家或标签，如：海边、古都、美食" />
    <span class="cnt" id="count"></span>
  </div>

  <section class="picker">
    <div class="picker-title"><i class="fas fa-list-check"></i> 选择要对比的目的地（最多 4 个，轻量城市展示地标美食与通用入口）</div>
    <div class="chips" id="chips"></div>
    <div class="basket" id="basket"></div>
  </section>

  <div id="result"></div>
</div>
