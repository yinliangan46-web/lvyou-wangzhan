<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>发现 MYL - 旅行人格 · 必去清单 · 剧游 · Solo · 最佳时节 · 预算测算</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Poppins:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --accent: #f97316;
            --purple: #8b5cf6; --purple-dark: #6d28d9;
            --text: #1e293b; --text-light: #64748b; --bg: #f0f4f8; --white: #fff;
            --radius: 18px; --shadow: 0 4px 24px rgba(0,0,0,.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,.12);
        }
        body { font-family: 'Noto Sans SC', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .header { position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; padding: 16px 0; }
        .header .container { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav { display: flex; gap: 24px; }
        .nav a { text-decoration: none; color: var(--text); font-weight: 500; transition: color .2s; font-size:.92rem; }
        .nav a:hover, .nav a.active { color: var(--primary); }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 30px; font-weight: 600; text-decoration: none; cursor: pointer; transition: all .25s; font-size: .9rem; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,.35); }
        .btn-sm { padding: 8px 20px; font-size: .85rem; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }
        .hero { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 40%, #7c3aed 100%); color: #fff; padding: 80px 0 60px; text-align: center; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 50%, rgba(255,255,255,.1) 0%, transparent 50%); animation: heroFloat 8s ease-in-out infinite; }
        @keyframes heroFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-20px); } }
        .hero h1 { font-size: 2.8rem; font-weight: 900; margin-bottom: 16px; position: relative; z-index: 1; }
        .hero p { font-size: 1.15rem; opacity: .9; max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }
        .tabs { display: flex; gap: 8px; background: #fff; padding: 8px; border-radius: 50px; box-shadow: var(--shadow-lg); max-width: 1100px; margin: -35px auto 40px; position: relative; z-index: 10; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 14px 16px; border: none; background: transparent; border-radius: 40px; font-size: .9rem; font-weight: 600; color: var(--text-light); cursor: pointer; transition: all .3s; white-space: nowrap; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
        .tab-panel { display: none; animation: fadeIn .4s; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
        .section { padding: 30px 0; }
        .section-title { font-size: 1.9rem; font-weight: 900; margin-bottom: 8px; text-align: center; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .section-desc { text-align: center; color: var(--text-light); margin-bottom: 36px; max-width: 500px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
<div class="container"><p>正在加载...</p></div>
</body>
</html>
