<div class="container">
  <div id="listView">
    <section class="hero">
      <h1>线路剧情叙事</h1>
      <p>把一条线路拆成章节，像读故事一样走进场景；点击线路进入详情，查看景点节点、当地美食与航班高铁入口，读完一章可收入收集册。</p>
    </section>

    <div class="searchbar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="搜索线路或城市，如：西安、火锅、海岛、古都" />
    </div>

    <section class="route-list" id="routeList"></section>
  </div>

  <div id="detailView" style="display:none">
    <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> 返回线路列表</button>
    <div id="detailHead"></div>
    <section id="chapters"></section>
    <section class="album">
      <h3><i class="fas fa-bookmark"></i> 我的剧情收集册</h3>
      <div class="album-grid" id="album"></div>
    </section>
  </div>
</div>
