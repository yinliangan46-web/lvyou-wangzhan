<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>花费拆解 · MYL旅行</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="budget.css" />
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo"><i class="fas fa-compass"></i><span>MYL</span></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="discover.html">✨ 发现 MYL</a>
      <a href="tools.html">🧰 智能工具</a>
      <a href="budget.html">花费拆解</a>
    </nav>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>花费拆解可视化</h1>
    <p>按目的地、天数、人数和预算档测算总花费，环形图拆分机票、住宿、餐饮、门票与交通；下方附站内预算参考、美食、住宿与往返交通入口。</p>
  </section>

  <section class="panel">
    <div class="form-grid">
      <div class="field">
        <label>目的地（可输入搜索）</label>
        <input list="cityList" id="cityInput" autocomplete="off" />
        <datalist id="cityList"></datalist>
      </div>
      <div class="field">
        <label>天数</label>
        <select id="days"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
      </div>
      <div class="field">
        <label>出行人数</label>
        <select id="ppl"><option value="1">1 人</option><option value="2" selected>2 人</option><option value="3">3 人及以上</option></select>
      </div>
      <div class="field">
        <label>预算档</label>
        <div class="seg" id="tier">
          <button data-t="budget">经济</button>
          <button data-t="comfort" class="active">舒适</button>
          <button data-t="luxury">品质</button>
        </div>
      </div>
    </div>
    <button class="btn" id="calcBtn"><i class="fas fa-calculator"></i> 生成花费拆解</button>
  </section>

  <section id="out"></section>
</div>

<script src="city-data.js"></script>
<script src="city-foods.js"></script>
<script src="city-history.js"></script>
<script src="city-landmarks.js"></script>
<script src="city-poi-bank.js"></script>
<script src="province-data-all.js"></script>
<script src="city-index.js"></script>
<script src="city-score-a.js"></script>
<script src="city-score-b.js"></script>
<script src="city-score.js"></script>
<script src="city-augment-1.js"></script>
<script src="city-augment-2.js"></script>
<script src="guide-patch.js"></script>
<script src="budget.js"></script>
</body>
</html>
